<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LINEで届く あなたの秘書</title>
<style>
  :root {
    --bg: #f5f6f4; --card: #ffffff; --ink: #1f2a24; --sub: #66736b; --line: #e2e6e2;
    --main: #1f8a4c; --main-soft: #e4f3ea; --warn: #c0392b; --warn-soft: #fbe9e7; --amber: #b7791f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
    font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 5; background: var(--main); color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25; }
  header h1 small { display: block; font-size: 11px; font-weight: 400; opacity: .9; }
  header .st { font-size: 12px; opacity: .9; }
  main { padding: 14px 14px 96px; max-width: 640px; margin: 0 auto; }
  .topbar { position: sticky; top: 0; z-index: 5; }
  .topbar header { position: static; }
  nav.tabs { background: #fff; border-bottom: 1px solid var(--line); display: flex; box-shadow: 0 2px 4px rgba(0,0,0,.04); }
  nav.tabs button { flex: 1; border: 0; background: none; padding: 11px 2px 10px; font: inherit; font-size: 14px; color: var(--sub); }
  nav.tabs button.on { color: var(--main); font-weight: 700; box-shadow: inset 0 -3px 0 var(--main); }
  nav.tabs button { position: relative; white-space: nowrap; }
  nav.tabs button.chk.pending::after { content: ''; position: absolute; top: 7px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
  .bigmsg { text-align: center; }
  .bigmsg .ico { font-size: 40px; line-height: 1; }
  .bigmsg .count { font-size: 22px; font-weight: 700; margin: 8px 0 2px; }
  .status { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); gap: 8px; }
  .status:first-of-type { border-top: 0; }
  .sub { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .sub button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; color: var(--ink); }
  .sub button.on { background: var(--main); color: #fff; border-color: var(--main); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .item { cursor: pointer; }
  .item .t { font-weight: 700; word-break: break-all; }
  .item .m { color: var(--sub); font-size: 13px; margin-top: 2px; }
  .chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--main-soft); color: var(--main); margin-right: 4px; }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.amber { background: #fdf3e1; color: var(--amber); }
  .chip.gray { background: #eef0ee; color: var(--sub); }
  h2 { font-size: 16px; margin: 18px 0 8px; }
  p.note { color: var(--sub); font-size: 13px; margin: 4px 0 10px; }
  .btn { display: inline-block; border: 0; border-radius: 10px; background: var(--main); color: #fff; padding: 11px 16px; font: inherit; font-weight: 700; width: 100%; }
  .btn.sec { background: #fff; color: var(--main); border: 1px solid var(--main); }
  .btn.danger { background: #fff; color: var(--warn); border: 1px solid var(--warn); }
  .btn:disabled { opacity: .5; }
  .row2 { display: flex; gap: 8px; } .row2 > * { flex: 1; }
  label.f { display: block; margin: 12px 0 4px; font-size: 14px; font-weight: 700; }
  label.f small { font-weight: 400; color: var(--sub); }
  input[type=text], input[type=password], input[type=date], input[type=time], input[type=number], input[type=url], select, textarea {
    width: 100%; font: inherit; padding: 10px 12px; border: 1px solid #cfd6d0; border-radius: 10px; background: #fff; color: var(--ink); }
  textarea { min-height: 80px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .check input { width: 22px; height: 22px; }
  .wd { display: flex; gap: 4px; flex-wrap: wrap; }
  .wd label { border: 1px solid #cfd6d0; border-radius: 8px; padding: 6px 10px; }
  .wd input { margin-right: 4px; }
  .add { position: fixed; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--main); color: #fff; font-size: 30px; line-height: 1; box-shadow: 0 4px 12px rgba(0,0,0,.2); z-index: 6; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .modal.show { display: flex; }
  .sheet { background: #fff; width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0 0 4px; font-size: 17px; }
  .actions { display: grid; gap: 8px; margin-top: 18px; }
  pre.msg { white-space: pre-wrap; word-break: break-all; background: #effaf2; border: 1px solid #cde9d6; border-radius: 12px; padding: 12px; font: inherit; font-size: 15px; margin: 0; }
  .toast { position: fixed; left: 50%; top: 128px; transform: translateX(-50%); background: #1f2a24; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; display: none; max-width: 90vw; }
  .toast.err { background: var(--warn); }
  .empty { text-align: center; color: var(--sub); padding: 24px 8px; }
  .filter { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 2px; }
  .filter button { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; }
  .filter button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .meter { height: 10px; background: #e6ebe7; border-radius: 99px; overflow: hidden; margin: 6px 0; }
  .meter > div { height: 100%; background: var(--main); }
  .loading { text-align: center; padding: 40px; color: var(--sub); }
  header .hr { display: flex; gap: 8px; align-items: center; }
  header .st { border: 0; border-radius: 999px; padding: 5px 10px; font: inherit; font-size: 12px; background: rgba(255,255,255,.2); color: #fff; display: none; }
  header .st.ng { background: #fff; color: var(--warn); font-weight: 700; }
  header .gear { border: 0; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; font-weight: 700; background: #fff; color: var(--main); display: none; }
  header .gear.on { background: #1a6b3c; color: #fff; box-shadow: inset 0 0 0 2px #fff; }
  .setup { border: 2px solid var(--main); }
  .setup h2 { margin: 0 0 8px; }
  .step { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
  .step:first-of-type { border-top: 0; }
  .step .n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: #e6ebe7; color: var(--sub); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .step.done .n { background: var(--main); color: #fff; }
  .step.done .s { color: var(--sub); text-decoration: line-through; }
  .step.now .n { background: var(--warn); color: #fff; }
  .step.now .s { font-weight: 700; }
  .step .d { font-size: 13px; color: var(--sub); }
  h2[id] { scroll-margin-top: 64px; }
  .sethead { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 6px; }
  .btn.slim { width: auto; padding: 6px 14px; font-size: 14px; }
  .offs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .offs label { border: 1px solid #cfd6d0; border-radius: 8px; padding: 6px 8px; font-size: 14px; display: flex; align-items: center; gap: 4px; }
  .offs input { width: 18px; height: 18px; margin: 0; }
  .calrow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  .calrow:first-child { border-top: 0; }
  .calrow input { width: 22px; height: 22px; flex: none; }
  .warnbox { background: var(--warn-soft); border: 1px solid #f3c3bd; border-radius: 10px; padding: 8px 10px; font-size: 13px; color: var(--warn); margin-top: 6px; }
</style>
</head>
<body>
<div class="topbar">
<header>
  <h1><small>LINEで届く</small>あなたの秘書</h1>
  <div class="hr"><button class="st" id="hdrState"></button><button class="gear" id="gearBtn">⚙ 設定</button></div>
</header>
<nav class="tabs" id="tabs" style="display:none">
  <button data-tab="today">今日</button>
  <button data-tab="tomorrow">明日</button>
  <button data-tab="tasks">タスク</button>
  <button data-tab="routine">定例</button>
  <button data-tab="irregular">単発</button>
  <button data-tab="check" class="chk">初期確認</button>
</nav>
</div>
<main id="app"><div class="loading">読み込み中…</div></main>
<button class="add" id="addBtn" style="display:none" aria-label="追加">＋</button>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var STORE = 'yourSecretaryLogin';
  var SITE_VERSION = '1.1.007';
  var TEST_STOP = 169; // テスト送信を止める数（月31日分の毎日のリマインドを残すため 200−31）
  var ADMIN_URL = 'https://script.google.com/macros/s/AKfycbw22sAd3JbIVTmkkY_Jy7cszqnWCHQ6_bYleeF1wt2PXHuvWWZ_zzqPkDXUplcw65k/exec'; // 顧客管理のURL
  var S = { conn: null, schema: null, data: null, settings: null, line: null, tab: 'today', taskFilter: '未完了', quota: null };
  var app = document.getElementById('app');

  // ---------- 小物 ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(msg, err) {
    var t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block';
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, err ? 5000 : 2200);
  }
  function loadConn() { try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { return null; } }
  function saveConn(c) { try { localStorage.setItem(STORE, JSON.stringify(c)); return true; } catch (e) { return false; } }
  function clearConn() { try { localStorage.removeItem(STORE); } catch (e) {} }

  function post_(url, body) {
    return fetch(url, { method: 'POST', body: JSON.stringify(body) })
      .then(function (r) { return r.text(); })
      .then(function (txt) {
        var j; try { j = JSON.parse(txt); } catch (e) { throw new Error('つながり先から正しい返事がありません。URLを確かめてください'); }
        if (!j.ok) { var er = new Error(String(j.error || 'うまくいきませんでした').replace(/合言葉/g, 'パスワード')); er.data = j; throw er; }
        return j;
      });
  }
  // お客さん自身のスプレッドシート（予定やタスクの中身）
  function api(action, extra) {
    return post_(S.conn.url, Object.assign({ action: action, key: S.conn.pw, accountId: S.conn.id }, extra || {}));
  }
  // 提供者の顧客管理（利用者IDとパスワードだけ）
  function adminApi(action, extra, cred) {
    cred = cred || S.conn;
    return post_(ADMIN_URL, Object.assign({ action: action, id: cred.id, pw: cred.pw }, extra || {}));
  }
  function busy(btn, on, label) { if (!btn) return; btn.disabled = on; if (on) { btn._l = btn.textContent; btn.textContent = label || '処理中…'; } else if (btn._l) btn.textContent = btn._l; }

  function categories() {
    return (S.data['カテゴリ'] || []).slice().sort(function (a, b) { return Number(a['並び順'] || 99) - Number(b['並び順'] || 99); }).map(function (r) { return r['名前']; });
  }
  function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function timeSel(id, v, allowEmpty) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(String(v || '')), h = m ? Number(m[1]) : null, mi = m ? m[2] : null;
    var hs = (allowEmpty ? '<option value="">—</option>' : '');
    for (var i = 0; i < 24; i++) hs += '<option value="' + ('0' + i).slice(-2) + '"' + (h === i ? ' selected' : '') + '>' + i + '時</option>';
    var mins = []; for (var k = 0; k < 60; k += 5) mins.push(('0' + k).slice(-2));
    if (mi && mins.indexOf(mi) < 0) { mins.push(mi); mins.sort(); }
    var ms = (allowEmpty ? '<option value="">—</option>' : '') + mins.map(function (x) { return '<option value="' + x + '"' + (mi === x ? ' selected' : '') + '>' + x + '分</option>'; }).join('');
    return '<div class="row2 tsel" id="' + id + '"><select>' + hs + '</select><select>' + ms + '</select></div>';
  }
  function timeVal(id) {
    var s = document.getElementById(id).querySelectorAll('select'), h = s[0].value, m = s[1].value;
    if (!h) return '';
    return h + ':' + (m || '00');
  }
  function shortUrl(u) { var m = /^(https:\/\/script\.google\.com\/macros\/s\/)(.{6}).*(.{4})(\/exec)$/.exec(u || ''); return m ? m[1] + m[2] + '…' + m[3] + m[4] : u; }
  function md(s) { var p = String(s || '').split('-'); return p.length === 3 ? Number(p[1]) + '/' + Number(p[2]) : s; }
  function daysLeft(s) { var p = String(s || '').split('-').map(Number); if (p.length !== 3 || !p[0]) return null; var t = today().split('-').map(Number); return Math.round((Date.UTC(p[0], p[1] - 1, p[2]) - Date.UTC(t[0], t[1] - 1, t[2])) / 86400000); }

  // ---------- ログイン ----------
  function bare() {
    document.getElementById('tabs').style.display = 'none';
    document.getElementById('addBtn').style.display = 'none';
    document.getElementById('hdrState').style.display = 'none';
    document.getElementById('gearBtn').style.display = 'none';
    document.getElementById('toast').style.display = 'none';
    closeModal();
  }
  function verLine() { return '<p class="note" style="text-align:center;margin-top:14px">バージョン ' + SITE_VERSION + '</p>'; }

  function renderLogin(msg) {
    bare();
    app.innerHTML =
      '<div class="card"><h2 style="margin-top:0">ログイン</h2>' +
      (msg ? '<p class="note" style="color:var(--warn)">' + esc(msg) + '</p>' : '') +
      '<label class="f">利用者ID</label><input type="text" id="lgId" autocomplete="username" autocapitalize="off">' +
      '<label class="f">パスワード</label><input type="password" id="lgPw" autocomplete="current-password">' +
      '<p class="note">利用者IDと最初のパスワードは、ご購入のときにお知らせしたものです。この端末にはログインした状態が残ります。</p>' +
      '<button class="btn" id="lgGo">ログイン</button></div>' + verLine();
    document.getElementById('lgGo').onclick = function () {
      var id = document.getElementById('lgId').value.trim(), pw = document.getElementById('lgPw').value;
      if (!id || !pw) { toast('利用者IDとパスワードを入れてください', true); return; }
      var btn = this; busy(btn, true, 'ログインしています…');
      doLogin({ id: id, pw: pw }).catch(function (e) { busy(btn, false); toast(e.message, true); });
    };
  }

  function doLogin(cred) {
    return adminApi('login', {}, cred).then(function (j) {
      S.conn = { id: cred.id, pw: cred.pw, url: j.boundUrl || '', name: j.name || '' };
      if (!saveConn(S.conn)) toast('この端末に保存できませんでした。次回もう一度ログインが必要です', true);
      if (j.mustChange) return renderChangePw(true);
      if (!S.conn.url) return renderConnect();
      return loadMain();
    });
  }

  function renderChangePw(first) {
    bare();
    app.innerHTML =
      '<div class="card"><h2 style="margin-top:0">' + (first ? 'パスワードを決めてください' : 'パスワードの変更') + '</h2>' +
      (first ? '<p class="note">今のパスワードは、提供者からお知らせした仮のものです。ご自分だけが知っているパスワードに変えてください。変えたあとは、提供者もあなたのパスワードを知りません。</p>' : '') +
      '<label class="f">新しいパスワード <small>（8文字以上）</small></label><input type="password" id="cpA" autocomplete="new-password">' +
      '<label class="f">もう一度</label><input type="password" id="cpB" autocomplete="new-password">' +
      '<div style="margin-top:14px"><button class="btn" id="cpGo">パスワードを変える</button></div></div>' + verLine();
    document.getElementById('cpGo').onclick = function () {
      var a = document.getElementById('cpA').value, b = document.getElementById('cpB').value;
      if (a.length < 8) { toast('8文字以上にしてください', true); return; }
      if (a !== b) { toast('2つのパスワードがちがいます', true); return; }
      var btn = this; busy(btn, true, '変えています…');
      adminApi('changePassword', { newPw: a }).then(function () {
        S.conn.pw = a; saveConn(S.conn); toast('パスワードを変えました');
        if (!S.conn.url) renderConnect(); else loadMain();
      }).catch(function (e) { busy(btn, false); toast(e.message, true); });
    };
  }

  // 接続先を変える前に、2回確かめる
  function confirmTwice(go) {
    openModal('<h3>接続先を変えますか？</h3>' +
      '<p>接続先を変えると、<b>今のスプレッドシートは完全に使えなくなります</b>。毎日のリマインドも止まります。</p>' +
      '<p class="note">1つの利用者IDで使えるスプレッドシートは、1つだけです。</p>' +
      '<div class="actions"><button class="btn danger" id="cf1Yes">はい</button><button class="btn sec" id="cf1No">いいえ</button></div>');
    document.getElementById('cf1No').onclick = closeModal;
    document.getElementById('cf1Yes').onclick = function () {
      openModal('<h3>本当によろしいですか？</h3>' +
        '<p>この操作のあと、<b>今のスプレッドシートには戻せません</b>（戻すには、もう一度この手続きが必要です）。</p>' +
        '<div class="actions"><button class="btn danger" id="cf2Yes">はい、接続先を変える</button><button class="btn sec" id="cf2No">やめる</button></div>');
      document.getElementById('cf2No').onclick = closeModal;
      document.getElementById('cf2Yes').onclick = function () { closeModal(); go(); };
    };
  }

  function renderConnect(changing) {
    bare();
    app.innerHTML =
      '<div class="card"><h2 style="margin-top:0">' + (changing ? '新しい接続先' : 'スプレッドシートとつなぐ') + '</h2>' +
      (changing ? '<p class="note" style="color:var(--warn)">ここでつなぐと、今までのスプレッドシートは使えなくなります。</p>'
                : '<p class="note">あなたの予定やタスクは、ご自分のスプレッドシートにだけ保存されます。この画面で、そのスプレッドシートとつなぎます。</p>') +
      '<label class="f">Apps ScriptのURL <small>（スプレッドシートのURLではありません。Apps Scriptの「デプロイ」→「デプロイを管理」→「ウェブアプリ」のURL。/exec で終わるもの）</small></label>' +
      '<input type="url" id="cUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">' +
      '<div style="margin-top:14px"><button class="btn" id="cGo">つなぐ</button></div>' +
      (changing ? '<div style="margin-top:8px"><button class="btn sec" id="cBack">変えずに戻る</button></div>'
                : '<div style="margin-top:8px"><button class="btn sec" id="cOut">ログアウト</button></div>') + '</div>' + verLine();
    if (changing) document.getElementById('cBack').onclick = function () { loadMain(); };
    else document.getElementById('cOut').onclick = logout;
    document.getElementById('cGo').onclick = function () {
      var url = document.getElementById('cUrl').value.trim();
      if (/docs\.google\.com\/spreadsheets/.test(url)) { toast('これはスプレッドシートのURLです。Apps Scriptの「デプロイ」→「デプロイを管理」にある、/exec で終わるURLを貼ってください', true); return; }
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)) { toast('Apps ScriptのURL（https://script.google.com/macros/s/… で始まり /exec で終わるもの）を貼ってください', true); return; }
      if (changing && url === S.conn.url) { toast('今と同じURLです', true); return; }
      var btn = this; busy(btn, true, 'つないでいます…');
      post_(url, { action: 'hello', key: S.conn.pw, accountId: S.conn.id }).then(function (h) {
        return adminApi('bind', { url: url, sheetId: h.sheetId, confirm: !!changing });
      }).then(function () {
        S.conn.url = url; saveConn(S.conn); toast(changing ? '接続先を変えました' : 'つながりました'); return loadMain();
      }).catch(function (e) {
        busy(btn, false);
        if (e.data && e.data.needConfirm) { confirmTwice(function () { renderConnect(true); }); return; }
        toast(e.message, true);
      });
    };
  }

  // 本体を読み込む
  function loadMain() {
    app.innerHTML = '<div class="loading">読み込み中…</div>';
    return api('load').then(accept).catch(function (e) {
      if (/このスプレッドシートのパスワードがちがいます/.test(e.message)) return renderProblem('pw');
      if (e.data && e.data.licenseError) return renderProblem('lic', e.message);
      renderProblem('other', e.message);
    });
  }

  function renderProblem(kind, msg) {
    bare();
    var body = kind === 'pw'
      ? '<p>スプレッドシートに登録されているパスワードと、今のパスワードが合いません（パスワードを初期化したときなどに起きます）。</p>' +
        '<p class="note">スプレッドシートの「拡張機能」→「Apps Script」を開き、上の関数の選択で「<b>パスワードリセット</b>」を選んで「実行」してください。終わったら下のボタンを押します。</p>' +
        '<button class="btn" id="pbFix">実行しました</button>'
      : '<p>' + esc(msg || 'うまく読み込めませんでした') + '</p>' +
        '<button class="btn" id="pbRetry">もう一度ためす</button>' +
        (kind === 'lic' ? '<div style="margin-top:8px"><button class="btn sec" id="pbConn">接続先を変える</button></div>' : '');
    app.innerHTML = '<div class="card"><h2 style="margin-top:0">確認が必要です</h2>' + body +
      '<div style="margin-top:8px"><button class="btn sec" id="pbOut">ログアウト</button></div></div>' + verLine();
    var f = document.getElementById('pbFix');
    if (f) f.onclick = function () {
      var btn = this; busy(btn, true, 'つないでいます…');
      post_(S.conn.url, { action: 'hello', key: S.conn.pw, accountId: S.conn.id }).then(loadMain).catch(function (e) { busy(btn, false); toast(e.message, true); });
    };
    var r = document.getElementById('pbRetry'); if (r) r.onclick = function () { loadMain(); };
    var c = document.getElementById('pbConn'); if (c) c.onclick = function () { confirmTwice(function () { renderConnect(true); }); };
    document.getElementById('pbOut').onclick = logout;
  }

  function logout() { clearConn(); S.conn = null; S.tab = 'today'; S.quota = null; S.landed = false; renderLogin(); }

  function accept(j) {
    S.schema = j.schema; S.data = j.data; S.settings = j.settings; S.line = j.line; S.sheet = j.sheet || null; S.version = j.version || ''; S.offsets = j.offsets || [];
    carryOldFlags();
    document.getElementById('tabs').style.display = 'flex';
    if (!S.landed) { S.landed = true; if (setupLeft()) S.tab = 'check'; }
    updateHeader();
    render();
  }

  function lineOk() { return !!(S.line && S.line.token && S.line.userId); }
  function updateHeader() {
    var st = document.getElementById('hdrState'), g = document.getElementById('gearBtn');
    st.style.display = 'inline-block'; g.style.display = 'inline-block';
    st.textContent = lineOk() ? 'LINE 接続済み' : 'LINE 未接続';
    st.classList.toggle('ng', !lineOk());
    g.classList.toggle('on', S.tab === 'settings');
    var c = document.querySelector('nav.tabs button.chk'); if (c && S.data) c.classList.toggle('pending', setupLeft() > 0);
  }
  var FLAGS = 'lineHishoFlags';
  // 「はじめにやること」の進み具合は、スプレッドシートの「設定」に残す（どの端末から開いても同じ）
  var FLAG_KEYS = { timeSet: '準備：時刻を決めた', testSent: '準備：送信確認' };
  function flags() {
    var st = S.settings || {}, f = {};
    Object.keys(FLAG_KEYS).forEach(function (k) { if (st[FLAG_KEYS[k]] === '○') f[k] = 1; });
    return f;
  }
  // 前の版でこの端末にだけ残していた進み具合を、スプレッドシートへ移す（1回だけ）
  function carryOldFlags() {
    var old; try { old = JSON.parse(localStorage.getItem(FLAGS) || 'null'); } catch (e) { old = null; }
    if (!old) return;
    var up = {}, now = flags();
    Object.keys(FLAG_KEYS).forEach(function (k) { if (old[k] && !now[k]) up[FLAG_KEYS[k]] = '○'; });
    var done = function () { try { localStorage.removeItem(FLAGS); } catch (e) {} };
    if (!Object.keys(up).length) { done(); return; }
    api('saveSettings', { settings: up }).then(function (j) { S.settings = j.settings; done(); updateHeader(); if (S.tab === 'check' || S.tab === 'today' || S.tab === 'tomorrow') render(); }).catch(function () {});
  }
  function openSettings(anchor) {
    if (S.tab !== 'settings') S.prevTab = S.tab;
    S.setSub = anchor === 'secTime' ? 'task' : 'all';
    S.tab = 'settings'; render();
    if (anchor) { var el = document.getElementById(anchor); if (el) el.scrollIntoView({ block: 'start' }); }
  }
  document.getElementById('gearBtn').onclick = function () {
    if (S.tab === 'settings') { S.tab = S.prevTab || 'today'; render(); } else openSettings();
  };
  document.getElementById('hdrState').onclick = function () { openSettings('secLine'); };


  // ---------- 画面切り替え ----------
  function render() {
    [].forEach.call(document.querySelectorAll('nav.tabs button'), function (b) { b.classList.toggle('on', b.dataset.tab === S.tab); });
    var add = document.getElementById('addBtn');
    add.style.display = (S.tab === 'tasks' || S.tab === 'routine' || S.tab === 'irregular') ? 'block' : 'none';
    updateHeader();
    window.scrollTo(0, 0);
    ({ today: viewToday, tomorrow: viewTomorrow, tasks: viewTasks, routine: viewRoutine, irregular: viewIrregular, check: viewCheck, settings: viewSettings })[S.tab]();
  }
  document.getElementById('tabs').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; S.tab = b.dataset.tab; render(); };
  document.getElementById('addBtn').onclick = function () {
    openEditor(S.tab === 'tasks' ? 'タスク台帳' : S.tab === 'routine' ? '定例' : 'イレギュラー', null);
  };

  // ---------- 今日 ----------
  function setupSteps() {
    var f = flags();
    var hasData = ['タスク台帳', '定例', 'イレギュラー'].some(function (n) { return (S.data[n] || []).length > 0; });
    return [
      { t: 'Apps Scriptとつなぐ', done: true },
      { t: 'LINEとつなぐ', d: '秘書用のLINE公式アカウントから届くようにします。', done: lineOk(), go: 'line', btn: 'LINEとつなぐ' },
      { t: '毎日のリマインドの時刻を決める', d: '毎日何時に届けるかを決めます。朝7時のままでよければ、開いて「保存する」を押すだけです。', done: !!f.timeSet, go: 'time', btn: '毎日のリマインドの時刻を決める' },
      { t: '予定やタスクを入れる', d: 'くり返しの定例（毎週月曜・隔週・毎月第3土曜など）や、今かかえているタスクを入れます。', done: hasData, go: 'routine', btn: '定例を入れる' },
      { t: 'LINE送信確認', d: 'ちゃんと届くかを確かめます。無料の月200通のうち、1通を使います。', done: !!f.testSent, go: 'send', btn: 'メッセージをLINEに送る' }
    ];
  }
  function setupCard() {
    var steps = setupSteps(), left = steps.filter(function (x) { return !x.done; });
    if (!left.length) return '';
    var now = left[0];
    return '<div class="card setup"><h2>はじめにやること <small style="font-weight:400;color:var(--sub)">（あと' + left.length + 'つ）</small></h2>' +
      steps.map(function (x, i) {
        var cls = x.done ? 'done' : (x === now ? 'now' : '');
        return '<div class="step ' + cls + '"><div class="n">' + (x.done ? '✓' : (i + 1)) + '</div><div><div class="s">' + esc(x.t) + '</div>' +
          (x === now ? '<div class="d">' + esc(x.d) + '</div>' : '') + '</div></div>';
      }).join('') +
      '<div style="margin-top:10px"><button class="btn" id="setupGo" data-go="' + now.go + '">' + esc(now.btn) + '</button></div></div>';
  }
  function setupLeft() { return S.data ? setupSteps().filter(function (x) { return !x.done; }).length : 0; }
  function quotaText(q) {
    if (!q || q.limit == null) return q ? '今月 ' + (q.used || 0) + '通 送信' : '今月の送信数を確かめられませんでした';
    return '今月 ' + q.used + '通 ／ ' + q.limit + '通（残り ' + Math.max(0, q.limit - q.used) + '通）';
  }
  function stopText(q) {
    return '今月すでに' + TEST_STOP + '通に達しています（' + q.used + '通／' + (q.limit || 200) + '通）。毎日のリマインドのために残しておくため、テスト送信は止めています。';
  }

  // 送る前に確認 → 送る → 結果を画面の真ん中に出す
  function doSend() {
    openModal('<div class="loading">今月の送信数を確かめています…</div>');
    api('quota').then(function (j) { return j.quota; }).catch(function () { return null; }).then(function (q) {
      S.quota = q;
      var stop = q && q.used >= TEST_STOP;
      openModal((stop ? '<h3>いまはテスト送信できません</h3>' :
        '<h3>テスト送信をしますか？</h3>' +
        '<p>「LINEに届く内容」を、いまLINEに送ります。</p>' +
        '<div class="warnbox" style="font-size:14px">これはテスト送信ですが、<b>LINE公式アカウントの無料の月200通のうち、1通を使います。</b>ご了承ください。</div>') +
        '<p class="note" style="font-size:15px;color:var(--ink)">' + esc(quotaText(q)) + '</p>' +
        (stop ? '<p class="note" style="color:var(--warn)">' + esc(stopText(q)) + '</p>' : '') +
        '<div class="actions">' + (stop ? '' : '<button class="btn" id="sdYes">はい、送ります</button>') + '<button class="btn sec" id="sdNo">' + (stop ? '閉じる' : 'やめる') + '</button></div>');
      document.getElementById('sdNo').onclick = closeModal;
      var y = document.getElementById('sdYes');
      if (y) y.onclick = function () {
        busy(this, true, '送っています…');
        api('testSend').then(function (j) {
          S.quota = j.quota; if (j.settings) S.settings = j.settings;
          openModal('<div class="bigmsg"><div class="ico">✅</div><h3 style="margin-top:8px">LINEに送りました</h3>' +
            '<p>スマホのLINEで、秘書から届いているか見てください。</p>' +
            '<div class="count">' + esc(quotaText(j.quota)) + '</div></div>' +
            '<div class="actions"><button class="btn" id="sdOk">閉じる</button></div>');
          document.getElementById('sdOk').onclick = function () { closeModal(); render(); };
        }).catch(function (e) {
          openModal('<h3>送れませんでした</h3><p>' + esc(e.message) + '</p><p class="note">1通も数えられていません。</p>' +
            '<div class="actions"><button class="btn sec" id="sdOk">閉じる</button></div>');
          document.getElementById('sdOk').onclick = closeModal;
        });
      };
    });
  }

  // LINEに届く内容（いまの設定で作ったもの）
  function previewBlock(id) {
    var next = (S.settings || {})['翌日の予定を送る'] === '○';
    return '<p class="note">' + (next ? '「翌日の予定を送る」がオンなので、明日の予定で作っています。' : '今日の予定で作っています。') + '</p>' +
      '<div id="' + id + '"><div class="loading">作っています…</div></div>';
  }
  function bindPreview(id, day) {
    api('preview', day ? { day: day } : {}).then(function (j) { var el = document.getElementById(id); if (el) el.innerHTML = '<pre class="msg">' + esc(j.text) + '</pre>'; })
      .catch(function (e) { var el = document.getElementById(id); if (el) el.innerHTML = '<div class="card">' + esc(e.message) + '</div>'; });
  }

  // 今日・明日：その日の予定（LINEに届くのと同じ形で表示）
  function viewDay(day) {
    app.innerHTML =
      (setupLeft() ? '<div class="card" style="border-color:var(--warn)"><b>はじめにやることが、あと' + setupLeft() + 'つ残っています。</b>' +
        '<div style="margin-top:8px"><button class="btn sec" id="toCheck">初期確認へ</button></div></div>' : '') +
      '<h2 style="margin-top:4px">' + (day === 'today' ? '今日の予定' : '明日の予定') + '</h2>' +
      '<div id="pv"><div class="loading">作っています…</div></div>';
    var tc = document.getElementById('toCheck'); if (tc) tc.onclick = function () { S.tab = 'check'; render(); };
    bindPreview('pv', day);
  }
  function viewToday() { viewDay('today'); }
  function viewTomorrow() { viewDay('tomorrow'); }

  // 初期確認：はじめにやること・つながりの一覧・送信数・LINE送信確認
  function viewCheck() {
    var s = S.settings || {}, ok = lineOk(), left = setupLeft();
    var times = '毎日 ' + (s['リマインドの時刻'] || '07:00') + (s['翌日の予定を送る'] === '○' ? '（翌日の予定）' : '（その日の予定）');
    var row = function (label, good, text) {
      return '<div class="status"><div><b>' + label + '</b><div class="note" style="margin:0">' + esc(text) + '</div></div>' +
        (good ? '<span class="chip">OK</span>' : '<span class="chip warn">まだです</span>') + '</div>';
    };
    app.innerHTML =
      (left ? setupCard() : '<div class="card" style="border-color:var(--main)"><b>✅ はじめにやることは、全部終わっています。</b>' +
        '<div style="margin-top:10px"><button class="btn" id="toAll">全体の設定画面へ</button></div></div>') +
      '<h2>つながりの一覧</h2><div class="card">' +
      row('スプレッドシート', true, S.sheet ? S.sheet.name : 'つながっています') +
      row('LINE', ok, ok ? '秘書のアカウントとつながっています' : 'まだつながっていません') +
      row('毎日のリマインド', !!flags().timeSet, flags().timeSet ? times : 'まだ決めていません（今は ' + times + '）') +
      '</div>' +
      '<h2>今月の送信数</h2><div class="card" id="qBox2"><div class="loading" style="padding:8px">確かめています…</div></div>' +
      (ok ? '<h2>LINE送信確認</h2><p class="note">下の内容を、いまLINEに送ります。<b>無料の月200通のうち、1通を使います。</b>送る前に確認が出ます。</p>' + previewBlock('pv2') +
        '<div style="margin-top:12px"><button class="btn" id="sendNow">メッセージをLINEに送る</button></div>' : '');
    if (ok) {
      bindPreview('pv2');
      document.getElementById('sendNow').onclick = function () { doSend(); };
      api('quota').then(function (j) {
        S.quota = j.quota; var b = document.getElementById('qBox2');
        if (b) b.innerHTML = '<div style="font-size:17px;font-weight:700">' + esc(quotaText(j.quota)) + '</div><p class="note">無料のプランは月200通までです。</p>' +
          (j.quota && j.quota.used >= TEST_STOP ? '<div class="warnbox">' + esc(stopText(j.quota)) + '</div>' : '');
      }).catch(function () { var b = document.getElementById('qBox2'); if (b) b.innerHTML = '<p class="note">今月の送信数を確かめられませんでした。</p>'; });
    } else {
      document.getElementById('qBox2').innerHTML = '<p class="note">LINEとつなぐと、ここに出ます。</p>';
    }
    var ta = document.getElementById('toAll'); if (ta) ta.onclick = function () { openSettings(); };
    var go = document.getElementById('setupGo');
    if (go) go.onclick = function () {
      var g = this.dataset.go;
      if (g === 'line') openSettings('secLine');
      else if (g === 'time') openSettings('secTime');
      else if (g === 'routine') { S.tab = 'routine'; render(); }
      else if (g === 'send') doSend();
    };
  }

  // ---------- 一覧の共通部品 ----------
  // パソコン（マウスで操作する画面）のときだけ「＋ 追加する」ボタンを出す
  function isPC() { try { return window.matchMedia('(hover: hover) and (pointer: fine) and (min-width: 700px)').matches; } catch (e) { return false; } }
  function emptyBox(msg, sheet) {
    return '<div class="empty">' + msg + '<br>' +
      (isPC() ? '<div style="margin:12px auto 4px;max-width:240px"><button class="btn pcAdd"' + (sheet ? ' data-sheet="' + esc(sheet) + '"' : '') + '>＋ 追加する</button></div>（右下の＋からも追加できます）'
              : '右下の「＋」から追加できます。') + '</div>';
  }
  function bindPcAdd() {
    [].forEach.call(app.querySelectorAll('.pcAdd'), function (b) {
      b.onclick = function () { if (b.dataset.sheet) openEditor(b.dataset.sheet, null); else document.getElementById('addBtn').onclick(); };
    });
  }
  function remindLine(r) { return r['リマインド'] ? '<div class="m">リマインド：' + esc(String(r['リマインド']).split(',').join('・')) + '</div>' : ''; }
  function span(r) {
    var n = Number(r['何日間'] || 1);
    if (n > 1) return n + '日間（1日目 ' + (r['開始'] || '') + ' 〜 ' + n + '日目 ' + (r['終了'] || '') + '）';
    return (r['開始'] || '') + (r['終了'] ? '〜' + r['終了'] : '');
  }

  // ---------- タスク ----------
  var STATE_CHIP = { '未着手': 'gray', '途中': '', '止まっている': 'warn', 'お返事待ち': 'amber', '完了': 'gray' };
  function viewTasks() {
    var filters = ['未完了', '緊急', '途中', '止まっている', 'お返事待ち', '未着手', '完了', 'すべて'];
    var rows = (S.data['タスク台帳'] || []).filter(function (r) {
      var f = S.taskFilter;
      if (f === 'すべて') return true;
      if (f === '未完了') return r['状態'] !== '完了';
      if (f === '緊急') return r['緊急'] === '○' && r['状態'] !== '完了';
      return r['状態'] === f;
    }).sort(function (a, b) {
      var ua = a['緊急'] === '○' ? 0 : 1, ub = b['緊急'] === '○' ? 0 : 1; if (ua !== ub) return ua - ub;
      return (a['期限'] || '9999').localeCompare(b['期限'] || '9999');
    });
    var html = '<div class="filter">' + filters.map(function (f) { return '<button data-f="' + f + '" class="' + (f === S.taskFilter ? 'on' : '') + '">' + f + '</button>'; }).join('') + '</div>';
    if (!rows.length) html += emptyBox('ここに入るタスクはありません。');
    rows.forEach(function (r) {
      var n = daysLeft(r['期限']);
      var due = r['期限'] ? (n < 0 ? '<span class="chip warn">期限切れ ' + md(r['期限']) + '</span>' : n <= 3 ? '<span class="chip amber">期限 ' + md(r['期限']) + '</span>' : '<span class="chip gray">期限 ' + md(r['期限']) + '</span>') : '';
      html += '<div class="card item" data-id="' + esc(r.ID) + '">' +
        '<div class="t">' + (r['緊急'] === '○' ? '<span class="chip warn">緊急</span>' : '') + esc(r['タスク']) + '</div>' +
        '<div class="m"><span class="chip ' + (STATE_CHIP[r['状態']] || '') + '">' + esc(r['状態'] || '未着手') + '</span>' + due +
        (r['カテゴリ'] ? '<span class="chip gray">' + esc(r['カテゴリ']) + '</span>' : '') + (r['仕事名'] ? esc(r['仕事名']) : '') + '</div>' +
        (r['次にやること'] ? '<div class="m">次：' + esc(r['次にやること']) + '</div>' : '') + remindLine(r) + '</div>';
    });
    app.innerHTML = html;
    app.querySelector('.filter').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; S.taskFilter = b.dataset.f; viewTasks(); };
    bindItems('タスク台帳'); bindPcAdd();
  }

  // ---------- 定例（くり返しの決め方はGoogleカレンダーの「カスタム」と同じ） ----------
  var WDS = ['月', '火', '水', '木', '金', '土', '日'];
  // カードのいちばん上に出す「毎週 月曜」「隔週 木曜」「毎月 第3土曜」などの文字
  function ruleText(r) {
    var k = Math.max(1, Math.floor(Number(r['間隔']) || 1)), u = r['単位'], t = '';
    var bp = String(r['開始日'] || '').split('-');
    if (u === '日') t = k === 1 ? '毎日' : k + '日ごと';
    else if (u === '週') {
      var days = WDS.filter(function (w) { return String(r['曜日'] || '').indexOf(w) >= 0; });
      var d = days.join('') === '月火水木金' ? '平日' : days.join('') === '月火水木金土日' ? '毎日' : days.join('・') + '曜';
      t = (k === 1 ? '毎週' : k === 2 ? '隔週' : k + '週間ごと') + ' ' + (days.length ? d : '（曜日なし）');
      if (k === 1 && d === '毎日') t = '毎日';
      if (k === 1 && d === '平日') t = '平日（月〜金）';
    } else if (u === 'か月') {
      var pre = k === 1 ? '毎月' : k + 'か月ごと';
      if ((r['月の決め方'] || '日付で') === '日付で') t = pre + ' ' + (r['日'] === '末日' ? '末日' : (r['日'] || '?') + '日');
      else t = pre + ' ' + (r['第何週'] === '最終週' ? '最終' : String(r['第何週'] || '').replace('週', '')) + (r['何曜日'] || '?') + '曜';
    } else if (u === '年') t = (k === 1 ? '毎年' : k + '年ごと') + (bp.length === 3 ? ' ' + Number(bp[1]) + '月' + Number(bp[2]) + '日' : '');
    if (r['終了日']) t += '（' + md(r['終了日']) + 'まで）';
    return t;
  }
  function viewRoutine() {
    var UO = { '日': 0, '週': 1, 'か月': 2, '年': 3 };
    var firstDay = function (r) { for (var i = 0; i < 7; i++) if (String(r['曜日'] || '').indexOf(WDS[i]) >= 0) return i; return 9; };
    var rows = (S.data['定例'] || []).slice().sort(function (a, b) {
      return (UO[a['単位']] - UO[b['単位']]) || (firstDay(a) - firstDay(b)) || (a['開始'] || '99').localeCompare(b['開始'] || '99');
    });
    var html = '<p class="note" style="margin-top:0">「毎週 月曜」「隔週 木曜」「毎月 第3土曜」など、くり返しの予定を入れます。</p>';
    if (!rows.length) html += emptyBox('まだありません。');
    rows.forEach(function (r) {
      html += '<div class="card item" data-id="' + esc(r.ID) + '" style="' + (r['有効'] === '○' ? '' : 'opacity:.5') + '">' +
        '<div style="font-size:13px;font-weight:700;color:var(--main)">' + esc(ruleText(r)) + (r['有効'] === '○' ? '' : ' <span class="chip gray">お休み中</span>') + '</div>' +
        '<div class="t">' + (r['種類'] === '時間の確保' ? '<span class="chip">時間の確保</span>' : '') + esc(r['内容']) + '</div>' +

  // ---------- 単発（シート名はイレギュラー） ----------
  function viewIrregular() {
    var t = today();
    var rows = (S.data['イレギュラー'] || []).slice().sort(function (a, b) { return (a['日付'] || '').localeCompare(b['日付'] || '') || (a['開始'] || '').localeCompare(b['開始'] || ''); });
    var endOf = function (r) { return r['終了日'] || r['日付'] || ''; };
    var future = rows.filter(function (r) { return endOf(r) >= t; }), past = rows.filter(function (r) { return endOf(r) < t; });
    var html = '<p class="note">急に入った予定や会議を入れます。いつもの定例を、その日だけ止めたり、お休みにしたりもできます。</p>';
    function card(r) {
      var chip = r['種類'] === 'この日は定例をお休み' ? 'warn' : r['種類'] === 'この日だけ定例を止める' ? 'amber' : '';
      var d = md(r['日付']) + (r['終了日'] && r['終了日'] !== r['日付'] ? '〜' + md(r['終了日']) : '');
      var tm = (r['開始'] || '') + (r['終了'] ? '〜' + r['終了'] : '');
      return '<div class="card item" data-id="' + esc(r.ID) + '"><div class="t">' + esc(r['内容'] || '（内容なし）') + '</div>' +
        '<div class="m">' + esc(d) + (tm ? ' ' + esc(tm) : '') + (r['場所'] ? '（' + esc(r['場所']) + '）' : '') + ' <span class="chip ' + chip + '">' + esc(r['種類']) + '</span>' +
        (r['カテゴリ'] ? '<span class="chip gray">' + esc(r['カテゴリ']) + '</span>' : '') + '</div>' + remindLine(r) + '</div>';
    }
    if (!future.length) html += emptyBox('これからの単発の予定はありません。');
    future.forEach(function (r) { html += card(r); });
    if (past.length) { html += '<h2>過ぎたもの</h2>'; past.reverse().slice(0, 20).forEach(function (r) { html += card(r); }); }
    app.innerHTML = html;
    bindItems('イレギュラー'); bindPcAdd();
  }

  function bindItems(sheet) {
    [].forEach.call(app.querySelectorAll('.item'), function (el) {
      el.onclick = function () {
        var sh = sheet || el.dataset.sheet;

  // ---------- 入力画面（どのシートでも共通） ----------
  function openEditor(sheet, row) {
    var def = S.schema[sheet]; var isNew = !row; row = row || {};
    var html = '<h3>' + esc(def.label) + (isNew ? 'を追加' : 'を編集') + '</h3>';
    def.fields.forEach(function (f) {
      if (f.hidden) return;
      var v = row[f.key] != null && row[f.key] !== '' ? row[f.key] : (isNew && f.default ? f.default : '');
      if (isNew && ((f.key === '日付' && sheet === 'イレギュラー') || (f.key === '開始日' && sheet === '定例'))) v = v || today();
      var id = 'f_' + f.key;
      html += '<div id="w_' + esc(f.key) + '">';
      html += '<label class="f">' + esc(f.key) + (f.required ? ' <small>（必須）</small>' : '') + (f.hint ? '<br><small>' + esc(f.hint) + '</small>' : '') + '</label>';
      if (f.type === 'select' || f.type === 'category') {
        var opts = f.type === 'category' ? [''].concat(categories()) : f.options.slice();
        if (v && opts.indexOf(v) < 0) opts = opts.concat([v]);
        html += '<select id="' + id + '">' + opts.map(function (o) { return '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(o === '' ? '（なし）' : o) + '</option>'; }).join('') + '</select>';
      } else if (f.type === 'check') {
        html += '<label class="check"><input type="checkbox" id="' + id + '"' + (v === '○' ? ' checked' : '') + '> ' + (f.key === '有効' ? '使う（外すと一時お休み）' : 'はい') + '</label>';
      } else if (f.type === 'weekdays') {
        html += '<div class="wd" id="' + id + '">' + ['月', '火', '水', '木', '金', '土', '日'].map(function (w) { return '<label><input type="checkbox" value="' + w + '"' + (String(v).indexOf(w) >= 0 ? ' checked' : '') + '>' + w + '</label>'; }).join('') + '</div>';
      } else if (f.type === 'offsets') {
        var on = String(v).split(',').map(function (x) { return x.trim(); });
        html += '<div class="offs" id="' + id + '">' + (S.offsets || []).map(function (o) { return '<label><input type="checkbox" value="' + esc(o) + '"' + (on.indexOf(o) >= 0 ? ' checked' : '') + '>' + esc(o) + '</label>'; }).join('') + '</div>';
      } else if (f.type === 'time') {
        html += timeSel(id, v, true);
      } else if (f.type === 'textarea') {
        html += '<textarea id="' + id + '">' + esc(v) + '</textarea>';
      } else {
        var tp = f.type === 'date' ? 'date' : f.type === 'number' ? 'number' : 'text';
        html += '<input type="' + tp + '" id="' + id + '" value="' + esc(v) + '"' + (tp === 'number' ? ' min="1"' : '') + '>';
      }
      html += '</div>';
    });
    html += '<div class="actions"><button class="btn" id="eSave">保存する</button>' +
      (isNew ? '' : '<button class="btn danger" id="eDel">削除する</button>') +
      '<button class="btn sec" id="eCancel">閉じる</button></div>';
    openModal(html);
    // showIf：ほかの項目の選び方によって、出したり隠したりする
    function shown(f) {
      if (!f.showIf) return true;
      var conds = Array.isArray(f.showIf[0]) ? f.showIf : [f.showIf];
      return conds.every(function (c) { var el = document.getElementById('f_' + c[0]); return !!el && el.value === c[1]; });
    }
    function applyShow() { def.fields.forEach(function (f) { if (f.hidden || !f.showIf) return; document.getElementById('w_' + f.key).style.display = shown(f) ? '' : 'none'; }); }
    def.fields.forEach(function (f) { if (f.hidden || f.type !== 'select') return; document.getElementById('f_' + f.key).addEventListener('change', applyShow); });
    applyShow();
    document.getElementById('eCancel').onclick = closeModal;
    document.getElementById('eSave').onclick = function () {
      var out = { ID: row.ID || '' };
      for (var i = 0; i < def.fields.length; i++) {
        var f = def.fields[i]; if (f.hidden) { if (row[f.key] != null) out[f.key] = row[f.key]; continue; }
        if (!shown(f)) { out[f.key] = ''; continue; }
        var el = document.getElementById('f_' + f.key), val;
        if (f.type === 'check') val = el.checked ? '○' : '';
        else if (f.type === 'time') val = timeVal('f_' + f.key);
        else if (f.type === 'weekdays') val = [].map.call(el.querySelectorAll('input:checked'), function (x) { return x.value; }).join('');
        else if (f.type === 'offsets') val = [].map.call(el.querySelectorAll('input:checked'), function (x) { return x.value; }).join(',');
        else val = el.value.trim();
        if (f.required && !val) { toast('「' + f.key + '」を入れてください', true); return; }
        out[f.key] = val;
      }
      if (sheet === '定例') {
        if (!(Number(out['間隔']) >= 1)) { toast('「間隔」は1以上の数にしてください', true); return; }
        if (out['単位'] === '週' && !out['曜日']) { toast('くり返す「曜日」を1つ以上選んでください', true); return; }
        if ((Number(out['間隔']) > 1 || out['単位'] === '年') && !out['開始日']) { toast('1回おきや毎年のときは「開始日」を入れてください（数える基準になります）', true); return; }
        if (out['終了日'] && out['開始日'] && out['終了日'] < out['開始日']) { toast('「終了日」は「開始日」より後にしてください', true); return; }
      }
      if (sheet === 'イレギュラー' && out['種類'] !== 'この日は定例をお休み' && !out['内容']) { toast('「内容」を入れてください', true); return; }
      if (sheet === 'イレギュラー' && out['終了日'] && out['終了日'] < out['日付']) { toast('「終了日」は「日付」より後にしてください', true); return; }
      var btn = this; busy(btn, true, '保存しています…');
      api('save', { sheet: sheet, row: out }).then(function (j) {
        var list = S.data[sheet] = S.data[sheet] || [];
        var idx = list.map(function (r) { return r.ID; }).indexOf(j.row.ID);
        if (idx >= 0) list[idx] = j.row; else list.push(j.row);
        closeModal(); render(); toast('保存しました');
      }).catch(function (e) { busy(btn, false); toast(e.message, true); });
    };
    if (!isNew) document.getElementById('eDel').onclick = function () {
      var btn = this;
      if (btn.dataset.sure !== '1') { btn.dataset.sure = '1'; btn.textContent = 'もう一度押すと削除します'; return; }
      busy(btn, true, '削除しています…');
      api('delete', { sheet: sheet, id: row.ID }).then(function () {
        S.data[sheet] = (S.data[sheet] || []).filter(function (r) { return r.ID !== row.ID; });
        closeModal(); render(); toast('削除しました');
      }).catch(function (e) { busy(btn, false); toast(e.message, true); });
    };
  }

      if (a.length < 8) { toast('8文字以上にしてください', true); return; }
      if (a !== b) { toast('2つのパスワードがちがいます', true); return; }
      var btn = this; busy(btn, true, '変えています…');
      api('changeKey', { newKey: a }).then(function () {
        return adminApi('changePassword', { newPw: a }).catch(function (e) {
          // 顧客管理で失敗したら、スプレッドシート側を元に戻す
          return post_(S.conn.url, { action: 'changeKey', key: a, accountId: S.conn.id, newKey: old }).then(function () { throw e; });
        });
      }).then(function () { S.conn.pw = a; saveConn(S.conn); closeModal(); toast('パスワードを変えました'); })
        .catch(function (e) { busy(btn, false); toast(e.message, true); });
    };
  }

  // ---------- 起動 ----------
  S.conn = loadConn();
  if (!S.conn || !S.conn.id) renderLogin();
  else doLogin({ id: S.conn.id, pw: S.conn.pw }).catch(function (e) { renderLogin('自動でログインできませんでした：' + e.message); });
})();
</script>
</body>
</html>
