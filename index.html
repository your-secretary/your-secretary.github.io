<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LINEで届く あなたの秘書</title>
<meta name="theme-color" content="#1f8a4c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="あなたの秘書">
<style>
  :root {
    --bg: #f5f6f4; --card: #ffffff; --ink: #1f2a24; --sub: #66736b; --line: #e2e6e2;
    --main: #1f8a4c; --main-soft: #e4f3ea; --warn: #c0392b; --warn-soft: #fbe9e7; --amber: #b7791f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
    font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 5; background: var(--main); color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25; }
  header h1 small { display: block; font-size: 11px; font-weight: 400; opacity: .9; }
  header .st { font-size: 12px; opacity: .9; }
  main { padding: 14px 14px 96px; max-width: 640px; margin: 0 auto; }
  .topbar { position: sticky; top: 0; z-index: 5; }
  .topbar header { position: static; }
  nav.tabs { background: #fff; border-bottom: 1px solid var(--line); display: flex; box-shadow: 0 2px 4px rgba(0,0,0,.04); }
  nav.tabs button { flex: 1; border: 0; background: none; padding: 11px 2px 10px; font: inherit; font-size: 14px; color: var(--sub); }
  nav.tabs button.on { color: var(--main); font-weight: 700; box-shadow: inset 0 -3px 0 var(--main); }
  nav.tabs button { position: relative; white-space: nowrap; flex: 1 1 auto; }
  @media (max-width: 420px) { nav.tabs button { font-size: 13px; padding-left: 0; padding-right: 0; } }
  @media (max-width: 370px) { nav.tabs button { font-size: 12px; } }
  nav.tabs button.chk.pending::after { content: ''; position: absolute; top: 7px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
  .bigmsg { text-align: center; }
  .bigmsg .ico { font-size: 40px; line-height: 1; }
  .bigmsg .count { font-size: 22px; font-weight: 700; margin: 8px 0 2px; }
  .status { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); gap: 8px; }
  .status:first-of-type { border-top: 0; }
  .sub { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .sub button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; color: var(--ink); }
  .sub button.on { background: var(--main); color: #fff; border-color: var(--main); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .item { cursor: pointer; }
  .item .kd { font-size: 12px; font-weight: 700; color: var(--main); margin-bottom: 2px; }
  .item .t { font-weight: 700; word-break: break-all; }
  .item .m { color: var(--sub); font-size: 13px; margin-top: 2px; }
  .chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--main-soft); color: var(--main); margin-right: 4px; }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.amber { background: #fdf3e1; color: var(--amber); }
  .chip.gray { background: #eef0ee; color: var(--sub); }
  h2 { font-size: 16px; margin: 18px 0 8px; }
  p.note { color: var(--sub); font-size: 13px; margin: 4px 0 10px; }
  .btn { display: inline-block; border: 0; border-radius: 10px; background: var(--main); color: #fff; padding: 11px 16px; font: inherit; font-weight: 700; width: 100%; }
  .btn.sec { background: #fff; color: var(--main); border: 1px solid var(--main); }
  .btn.danger { background: #fff; color: var(--warn); border: 1px solid var(--warn); }
  .btn:disabled { opacity: .5; }
  .row2 { display: flex; gap: 8px; } .row2 > * { flex: 1; }
  label.f { display: block; margin: 12px 0 4px; font-size: 14px; font-weight: 700; }
  label.f small { font-weight: 400; color: var(--sub); }
  input[type=text], input[type=password], input[type=date], input[type=time], input[type=number], input[type=url], input[type=email], select, textarea {
    width: 100%; font: inherit; padding: 10px 12px; border: 1px solid #cfd6d0; border-radius: 10px; background: #fff; color: var(--ink); }
  textarea { min-height: 80px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .check input { width: 22px; height: 22px; }
  .wd { display: flex; gap: 4px; flex-wrap: wrap; }
  .wd label { border: 1px solid #cfd6d0; border-radius: 8px; padding: 6px 10px; }
  .wd input { margin-right: 4px; }
  .add { position: fixed; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--main); color: #fff; font-size: 30px; line-height: 1; box-shadow: 0 4px 12px rgba(0,0,0,.2); z-index: 6; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  .modal.show { display: flex; }
  .sheet { background: #fff; width: 100%; max-width: 640px; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow-y: auto; border-radius: 16px; padding: 16px 16px 20px; box-shadow: 0 18px 50px rgba(0,0,0,.18); }
  .sheet h3 { margin: 0 0 4px; font-size: 17px; }
  .actions { display: grid; gap: 8px; margin-top: 18px; }
  pre.msg { white-space: pre-wrap; word-break: break-all; background: #effaf2; border: 1px solid #cde9d6; border-radius: 12px; padding: 12px; font: inherit; font-size: 15px; margin: 0; }
  .toast { position: fixed; left: 50%; top: 128px; transform: translateX(-50%); background: #1f2a24; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; display: none; max-width: 90vw; }
  .toast.err { background: var(--warn); }
  .empty { text-align: center; color: var(--sub); padding: 24px 8px; }
  .filter { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 2px; }
  .filter button { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; }
  .filter button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .meter { height: 10px; background: #e6ebe7; border-radius: 99px; overflow: hidden; margin: 6px 0; }
  .meter > div { height: 100%; background: var(--main); }
  .loading { text-align: center; padding: 40px; color: var(--sub); }
  header .hr { display: flex; gap: 8px; align-items: center; }
  header { flex-wrap: wrap; }
  header .inqrow { order: 3; flex-basis: 100%; display: none; justify-content: center; margin-top: 8px; }
  header .inqrow.on { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn.slim.done { background: var(--main-soft); color: var(--main); box-shadow: none; cursor: default; }
  .reply { background: var(--main-soft); border-radius: 10px; padding: 10px 12px; margin-top: 10px; white-space: pre-wrap; }
  .reply .rh { font-size: 12px; color: var(--main); font-weight: 700; margin-bottom: 4px; white-space: normal; }
  header .inqbar { border: 0; border-radius: 999px; padding: 6px 16px; font: inherit; font-size: 13px; font-weight: 700; background: #fff; color: var(--warn); box-shadow: 0 2px 8px rgba(0,0,0,.15); animation: pop .35s cubic-bezier(.34, 1.56, .64, 1); }
  .inqimgs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .inqimgs .th { position: relative; width: 72px; height: 72px; border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
  .inqimgs .th img { width: 100%; height: 100%; object-fit: cover; }
  .inqimgs .th button { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 13px; line-height: 22px; padding: 0; }
  .inqfull img { display: block; width: 100%; border-radius: 8px; margin-top: 8px; box-shadow: inset 0 0 0 1px var(--line); }
  textarea#iqB { width: 100%; min-height: 120px; box-sizing: border-box; font: inherit; font-size: 16px; padding: 10px; border: 1px solid #cfd6d0; border-radius: 10px; }
  header .st { border: 0; border-radius: 999px; padding: 5px 10px; font: inherit; font-size: 12px; background: rgba(255,255,255,.2); color: #fff; display: none; }
  header .st.ng { background: #fff; color: var(--warn); font-weight: 700; }
  header .gear { border: 0; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; font-weight: 700; background: #fff; color: var(--main); display: none; }
  header .gear.on { background: #1a6b3c; color: #fff; box-shadow: inset 0 0 0 2px #fff; }
  .setup { border: 2px solid var(--main); }
  .setup h2 { margin: 0 0 8px; }
  .step { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
  .step:first-of-type { border-top: 0; }
  .step .n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: #e6ebe7; color: var(--sub); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .step.done .n { background: var(--main); color: #fff; }
  .step.done .s { color: var(--sub); text-decoration: line-through; }
  .step.now .n { background: var(--warn); color: #fff; }
  .step.now .s { font-weight: 700; }
  .step .d { font-size: 13px; color: var(--sub); }
  h2[id] { scroll-margin-top: 64px; }
  .sethead { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 6px; }
  .btn.slim { width: auto; padding: 6px 14px; font-size: 14px; }
  .offs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .offs label { border: 1px solid #cfd6d0; border-radius: 8px; padding: 6px 8px; font-size: 14px; display: flex; align-items: center; gap: 4px; }
  .offs input { width: 18px; height: 18px; margin: 0; }
  .calrow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  .calrow:first-child { border-top: 0; }
  .calrow input { width: 22px; height: 22px; flex: none; }
  .warnbox { background: var(--warn-soft); border: 1px solid #f3c3bd; border-radius: 10px; padding: 8px 10px; font-size: 13px; color: var(--warn); margin-top: 6px; }
  /* ── さわった感じ（押すと少し沈んで、はねて戻る） ── */
  .btn, nav.tabs button, .item, .filter button, .sub button, .hbtn, header .gear, header .st, .add {
    transition: transform .32s cubic-bezier(.34, 1.56, .64, 1), box-shadow .2s; -webkit-tap-highlight-color: transparent; }
  .btn:active, nav.tabs button:active, .item:active, .filter button:active, .sub button:active, .hbtn:active, header .gear:active, header .st:active, .add:active {
    transform: scale(.94); transition-duration: .08s; }
  header h1 { cursor: pointer; }
  /* ── 開いたときの画面：帯 → 細い線 → 雨だれ → 着地してつぶれる → 正方形のロゴに広がる → 白い文字 ── */
  @font-face { font-family: 'SplashFont'; src: url('icons/splash.woff2') format('woff2'); font-weight: 700; font-display: block; }
  #splash { position: fixed; inset: 0; z-index: 50; background: #fff; overflow: hidden; transition: opacity .5s ease; }
  #splash .band { position: absolute; left: 0; right: 0; top: 0; height: calc(56px + env(safe-area-inset-top)); background: var(--main); transform: scaleX(0); transform-origin: left; }
  #splash .line { position: absolute; left: 50%; width: 2px; margin-left: -1px; height: 0; background: var(--main); border-radius: 1px; }
  #splash .drop { position: absolute; left: 50%; top: 0; width: 14px; height: 20px; margin-left: -7px; fill: var(--main); opacity: 0; transform-origin: 50% 0; overflow: visible; }
  #splash .lw { position: absolute; left: 50%; width: 0; height: 0; display: flex; justify-content: center; align-items: center; pointer-events: none; }
  #splash .logo { flex: none; width: 0; height: 0; background: var(--main); display: flex; align-items: center; justify-content: center; overflow: hidden;
    color: #fff; font-family: 'SplashFont', 'Zen Old Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-weight: 700; box-shadow: 0 18px 40px rgba(31,138,76,0); }
  #splash .logo .in { display: flex; flex-direction: column; align-items: center; }
  #splash .logo .s1 { letter-spacing: .24em; padding-left: .24em; opacity: .82; white-space: nowrap; min-height: 1.4em; line-height: 1.4; }
  #splash .logo .s2 { letter-spacing: .04em; white-space: nowrap; min-height: 1.35em; line-height: 1.35; }
  #splash .logo .rule { width: 18%; height: 1px; background: rgba(255,255,255,.5); transform: scaleX(0); }
  #splash .logo .s3 { letter-spacing: .42em; padding-left: .42em; opacity: .82; white-space: nowrap; min-height: 1.4em; line-height: 1.4; }
  #splash .cur { display: inline-block; width: 1px; height: .9em; background: rgba(255,255,255,.85); vertical-align: -.08em; margin-left: 2px; animation: blink .9s step-end infinite; }
  #splash .tap { position: absolute; left: 0; right: 0; text-align: center; font-family: 'SplashFont', 'Zen Old Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    font-weight: 700; font-size: 12px; letter-spacing: .36em; padding-left: .36em; color: var(--sub); opacity: 0; transform: translateY(6px); transition: opacity .9s ease, transform .9s ease; }
  #splash .tap.on { opacity: 1; transform: none; }
  #splash .tap.on span { animation: breathe 2.6s ease-in-out infinite; }
  #splash.out { opacity: 0; pointer-events: none; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes breathe { 50% { opacity: .35; } }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
  /* ── ホーム画面 ── */
  .home { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 18px 0 30px; box-sizing: border-box; }
  .home .hello { color: var(--sub); font-size: 14px; margin-bottom: 4px; }
  .hbtn { width: 72%; max-width: 420px; border: 0; border-radius: 18px; background: #fff; box-shadow: 0 3px 10px rgba(0,0,0,.08), inset 0 0 0 1px var(--line);
    padding: 16px 18px; font: inherit; text-align: left; color: var(--ink); display: flex; align-items: center; gap: 12px; position: relative; }
  .hbtn .ic { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--main-soft); color: var(--main); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .hbtn .lb { font-size: 17px; font-weight: 700; line-height: 1.3; }
  .hbtn .sm { font-size: 12px; color: var(--sub); line-height: 1.4; }
  .hbtn .dot { position: absolute; top: 10px; right: 12px; width: 9px; height: 9px; border-radius: 50%; background: var(--warn); }
  .hbtn.goL, .hbtn.goR { transition: transform .45s cubic-bezier(.55, 0, .7, .2), opacity .45s; opacity: 0; }
  .hbtn.goL { transform: translateX(-120vw); }
  .homeCheck { width: 100%; margin-top: 18px; transition: opacity .3s; }
  .homeCheck.fade { opacity: 0; }
  .hbtn.goR { transform: translateX(120vw); }
  .hbtn.chosen { transition: transform .5s cubic-bezier(.34, 1.4, .64, 1); z-index: 2; box-shadow: 0 10px 26px rgba(31,138,76,.25), inset 0 0 0 2px var(--main); }
  /* ── 読み込み中 ── */
  #busy { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; background: rgba(255,255,255,.35); }
  #busy.show { display: flex; }
  #busy .bx { background: #fff; border-radius: 16px; padding: 18px 24px; box-shadow: 0 8px 24px rgba(0,0,0,.15); display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 14px; animation: pop .35s cubic-bezier(.34, 1.56, .64, 1); }
  #busy .sp { width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--main-soft); border-top-color: var(--main); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="splash" aria-label="LINEで届く あなたの秘書 リマインダー"><div class="band"></div><div class="line"></div><svg class="drop" viewBox="0 0 20 28" aria-hidden="true"><path d="M10 0C10 0 2.2 10.4 2.2 17.8a7.8 7.8 0 0 0 15.6 0C17.8 10.4 10 0 10 0z"/></svg><div class="lw"><div class="logo"><div class="in"><div class="s1"></div><div class="s2"></div><div class="rule"></div><div class="s3"></div></div></div></div><div class="tap"><span>タップしてください</span></div></div>
<div id="busy"><div class="bx"><div class="sp"></div>読み込み中です</div></div>
<div class="topbar">
<header>
  <h1><small>LINEで届く</small>あなたの秘書</h1>
  <div class="hr"><button class="st" id="hdrState"></button><button class="gear" id="gearBtn">⚙ 設定</button></div>
  <div class="inqrow" id="inqRow"><button class="inqbar" id="inqBar" style="display:none"></button><button class="inqbar" id="repBar" style="display:none"></button></div>
</header>
<nav class="tabs" id="tabs" style="display:none">
  <button data-tab="home" class="chk">ホーム</button>
  <button data-tab="today">今日</button>
  <button data-tab="tomorrow">明日</button>
  <button data-tab="tasks">タスク（定例・単発）</button>
</nav>
</div>
<main id="app"><div class="loading">読み込み中…</div></main>
<button class="add" id="addBtn" style="display:none" aria-label="追加">＋</button>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var STORE = 'yourSecretaryLogin';
  var SITE_VERSION = '1.1.024';
  var TEST_STOP = 169; // テスト送信を止める数（月31日分の毎日のリマインドを残すため 200−31）
  var ADMIN_URL = 'https://script.google.com/macros/s/AKfycbw22sAd3JbIVTmkkY_Jy7cszqnWCHQ6_bYleeF1wt2PXHuvWWZ_zzqPkDXUplcw65k/exec'; // 顧客管理のURL
  var S = { conn: null, schema: null, data: null, settings: null, line: null, tab: 'today', taskFilter: 'すべて', quota: null };
  // 開いたときの読み込み（ログイン・中身・設定で使う一覧）が終わったら、ロゴを広げる
  var BOOT = { done: false, cb: null };
  function bootDone() { if (BOOT.done) return; BOOT.done = true; if (BOOT.cb) BOOT.cb(); }
  var app = document.getElementById('app');

  // ---------- 小物 ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(msg, err) {
    var t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block';
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, err ? 5000 : 2200);
  }
  function loadConn() { try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { return null; } }
  function saveConn(c) { try { localStorage.setItem(STORE, JSON.stringify(c)); return true; } catch (e) { return false; } }
  function clearConn() { try { localStorage.removeItem(STORE); } catch (e) {} }

  function post_(url, body) {
    return fetch(url, { method: 'POST', body: JSON.stringify(body) })
      .then(function (r) { return r.text(); })
      .then(function (txt) {
        var j; try { j = JSON.parse(txt); } catch (e) { throw new Error('つながり先から正しい返事がありません。URLを確かめてください'); }
        if (!j.ok) { var er = new Error(String(j.error || 'うまくいきませんでした').replace(/合言葉/g, 'パスワード')); er.data = j; throw er; }
        return j;
      });
  }
  // 読み込み中のくるくる（0.2秒より長くかかるときだけ出す）
  var BUSY_N = 0, BUSY_T = null;
  function busyOn() { BUSY_N++; if (BUSY_N === 1) BUSY_T = setTimeout(function () { document.getElementById('busy').classList.add('show'); }, 200); }
  function busyOff() { BUSY_N = Math.max(0, BUSY_N - 1); if (!BUSY_N) { clearTimeout(BUSY_T); document.getElementById('busy').classList.remove('show'); } }
  function withBusy(p) { busyOn(); return p.then(function (v) { busyOff(); return v; }, function (e) { busyOff(); throw e; }); }
  var BUSY_ACTIONS = { load: 1, preview: 1, save: 1, 'delete': 1, saveSettings: 1, saveLine: 1, calendars: 1, changeKey: 1 };
  // お客さん自身のスプレッドシート（予定やタスクの中身）
  function api(action, extra) {
    var p = post_(S.conn.url, Object.assign({ action: action, key: S.conn.pw, accountId: S.conn.id }, extra || {}));
    if (changesPreview(action, extra)) p = p.then(function (j) { clearPreviews(); return j; });
    return BUSY_ACTIONS[action] ? withBusy(p) : p;
  }
  // このサイトで予定・タスク・設定を変えたときだけ、保存してある「今日・明日の予定」を作り直す
  function changesPreview(action, extra) {
    if (action === 'save' || action === 'delete' || action === 'saveLine') return true;
    if (action !== 'saveSettings') return false;
    return Object.keys((extra && extra.settings) || {}).some(function (k) { return k.indexOf('準備：') !== 0; });

  // お問い合わせ（名前・メールアドレス・内容・スクショ3枚まで）
  function openInquiry() {

  // 画像を小さく軽くする（長い辺1280px・JPEG）
  function shrinkImage(file) {
    return new Promise(function (ok) {
      if (!/^image\//.test(file.type)) { toast('画像のファイルを選んでください', true); ok(null); return; }
      var rd = new FileReader();
      rd.onload = function () {
        var im = new Image();
        im.onload = function () {
          var make = function (max, q) {
            var k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
            c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
            var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
            return c.toDataURL('image/jpeg', q);
          };
          var d = make(1280, .75); if (d.length > 1400000) d = make(960, .6); if (d.length > 1400000) d = make(720, .5);
          ok(d);
        };
        im.onerror = function () { toast('この画像は読めませんでした', true); ok(null); };
        im.src = rd.result;
      };
      rd.readAsDataURL(file);
    });
  }

  function logout() { clearConn(); S.conn = null; S.isAdmin = false; S.inq = 0; S.rep = 0; showInqBar(); S.tab = 'today'; S.quota = null; S.landed = false; renderLogin(); }

  function accept(j) {
    S.schema = j.schema; S.data = j.data; S.settings = j.settings; S.line = j.line; S.sheet = j.sheet || null; S.version = j.version || ''; S.offsets = j.offsets || [];
    carryOldFlags();
    document.getElementById('tabs').style.display = 'flex';
    if (!S.landed) { S.landed = true; S.tab = 'home'; }
    markStandalone();
    updateHeader();
    render();
    S.pre = prefetch();
  }
  function prefetch() {
    var call = function (action) { return post_(S.conn.url, { action: action, key: S.conn.pw, accountId: S.conn.id }); };
    if (!hourGet('calendars')) return call('calendars').then(function (j) { hourPut('calendars', (j.calendars || []).map(function (x) { return { id: x.id, name: x.name }; })); }).catch(function () {});
  }

  function lineOk() { return !!(S.line && S.line.token && S.line.userId); }
  function updateHeader() {
    var st = document.getElementById('hdrState'), g = document.getElementById('gearBtn');
    st.style.display = 'inline-block'; g.style.display = 'inline-block';
    st.textContent = lineOk() ? 'LINE 接続済み' : 'LINE 未接続';
    st.classList.toggle('ng', !lineOk());
    g.classList.toggle('on', S.tab === 'settings');
    var c = document.querySelector('nav.tabs button.chk'); if (c && S.data) c.classList.toggle('pending', setupLeft() > 0);
    reportProgress();
  }
  var FLAGS = 'lineHishoFlags';
  // 「はじめにやること」の進み具合は、スプレッドシートの「設定」に残す（どの端末から開いても同じ）
  var FLAG_KEYS = { timeSet: '準備：時刻を決めた', testSent: '準備：送信確認', home: '準備：ホーム画面' };
  function flags() {
    var st = S.settings || {}, f = {};
    Object.keys(FLAG_KEYS).forEach(function (k) { if (st[FLAG_KEYS[k]] === '○') f[k] = 1; });
    return f;
  }
  // 前の版でこの端末にだけ残していた進み具合を、スプレッドシートへ移す（1回だけ）
  function carryOldFlags() {
    var old; try { old = JSON.parse(localStorage.getItem(FLAGS) || 'null'); } catch (e) { old = null; }
    if (!old) return;
    var up = {}, now = flags();
    Object.keys(FLAG_KEYS).forEach(function (k) { if (old[k] && !now[k]) up[FLAG_KEYS[k]] = '○'; });
    var done = function () { try { localStorage.removeItem(FLAGS); } catch (e) {} };
    if (!Object.keys(up).length) { done(); return; }
    api('saveSettings', { settings: up }).then(function (j) { S.settings = j.settings; done(); updateHeader(); if (S.tab === 'home' || S.tab === 'today' || S.tab === 'tomorrow') render(); }).catch(function () {});
  }
  function goSetup() {
    S.tab = 'home'; render();
    var el = document.getElementById('chkArea'); if (el) el.scrollIntoView({ block: 'start' });
  }
  function openSettings(anchor) {
    if (S.tab !== 'settings' && S.tab !== 'admin') S.prevTab = S.tab;
    S.setSub = anchor === 'secTime' ? 'task' : 'all';
    S.tab = 'settings'; render();
    if (anchor) { var el = document.getElementById(anchor); if (el) el.scrollIntoView({ block: 'start' }); }
  }
  document.getElementById('gearBtn').onclick = function () {
    if (S.tab === 'settings') { S.tab = S.prevTab || 'today'; render(); } else openSettings();
  };
  document.getElementById('hdrState').onclick = function () { openSettings('secLine'); };
  document.querySelector('header h1').onclick = function () { if (S.data) { S.tab = 'home'; render(); } };


  // ---------- 画面切り替え ----------
  function render() {
    [].forEach.call(document.querySelectorAll('nav.tabs button'), function (b) { b.classList.toggle('on', b.dataset.tab === S.tab); });
    var add = document.getElementById('addBtn');
    add.style.display = S.tab === 'tasks' ? 'block' : 'none';
    updateHeader();
    window.scrollTo(0, 0);
    if (S.tab === 'check') S.tab = 'home';
    ({ myinq: viewMyInq, home: viewHome, admin: viewAdmin, today: viewToday, tomorrow: viewTomorrow, tasks: viewTasks, settings: viewSettings })[S.tab]();
  }
  document.getElementById('tabs').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; S.tab = b.dataset.tab; render(); };
  document.getElementById('addBtn').onclick = function () {
    chooseAdd();
  };

  // ---------- 今日 ----------
  function setupSteps() {
    var f = flags();
    var hasData = ['タスク台帳', '定例', 'イレギュラー'].some(function (n) { return (S.data[n] || []).length > 0; });
    return [
      { t: 'Apps Scriptとつなぐ', done: true },
      { t: 'LINEとつなぐ', d: '秘書用のLINE公式アカウントから届くようにします。', done: lineOk(), go: 'line', btn: 'LINEとつなぐ' },
      { t: '毎日のリマインドの時刻を決める', d: '毎日何時に届けるかを決めます。朝7時のままでよければ、開いて「保存する」を押すだけです。', done: !!f.timeSet, go: 'time', btn: '毎日のリマインドの時刻を決める' },
      { t: '予定やタスクを入れる', d: '「タスク（定例・単発）」タブで、くり返しの定例（毎週月曜・隔週・毎月第3土曜など）や、単発の予定・やることを入れます。', done: hasData, go: 'tasks', btn: '予定やタスクを入れる' },
      { t: 'LINE送信確認', d: 'ちゃんと届くかを確かめます。無料の月200通のうち、1通を使います。', done: !!f.testSent, go: 'send', btn: 'メッセージをLINEに送る' },
      { t: 'スマホのホーム画面に追加する', d: 'このサイトをスマホのホーム画面に置くと、アプリのように開けます。', done: !!f.home || isStandalone(), go: 'homeAdd', btn: 'ホーム画面に追加する' }
    ];
  }
  function setupCard() {
    var steps = setupSteps(), left = steps.filter(function (x) { return !x.done; });
    if (!left.length) return '';
    var now = left[0];
    return '<div class="card setup"><h2>はじめにやること <small style="font-weight:400;color:var(--sub)">（あと' + left.length + 'つ）</small></h2>' +
      steps.map(function (x, i) {
        var cls = x.done ? 'done' : (x === now ? 'now' : '');
        return '<div class="step ' + cls + '"><div class="n">' + (x.done ? '✓' : (i + 1)) + '</div><div><div class="s">' + esc(x.t) + '</div>' +
          (x === now ? '<div class="d">' + esc(x.d) + '</div>' : '') + '</div></div>';
      }).join('') +
      '<div style="margin-top:10px"><button class="btn" id="setupGo" data-go="' + now.go + '">' + esc(now.btn) + '</button></div>' +
      '<p class="note" style="margin:8px 0 0;text-align:center"><a href="guide.html" target="_blank" rel="noopener" style="color:var(--main)">くわしい手順：はじめての方へ</a></p></div>';
  }
  // 「はじめにやること」の進み具合を顧客管理に知らせる（終わったかどうかだけ。変わったときだけ送る）
  function reportProgress() {
    if (!S.data || !S.conn) return;
    var steps = setupSteps().map(function (x) { return { t: x.t, done: !!x.done }; });
    var sig = JSON.stringify(steps);
    if (sig === S.progSent) return;
    S.progSent = sig;
    adminApi('progress', { steps: steps }).catch(function () { S.progSent = ''; });
  }
  function setupLeft() { return S.data ? setupSteps().filter(function (x) { return !x.done; }).length : 0; }
  function quotaText(q) {
    if (!q || q.limit == null) return q ? '今月 ' + (q.used || 0) + '通 送信' : '今月の送信数を確かめられませんでした';
    return '今月 ' + q.used + '通 ／ ' + q.limit + '通（残り ' + Math.max(0, q.limit - q.used) + '通）';
  }
  function stopText(q) {
    return '今月すでに' + TEST_STOP + '通に達しています（' + q.used + '通／' + (q.limit || 200) + '通）。毎日のリマインドのために残しておくため、テスト送信は止めています。';
  }

  // 送る前に確認 → 送る → 結果を画面の真ん中に出す
  function doSend() {
    openModal('<div class="loading">今月の送信数を確かめています…</div>');
    api('quota').then(function (j) { return j.quota; }).catch(function () { return null; }).then(function (q) {
      S.quota = q; if (q) hourPut('quota', q);
      var stop = q && q.used >= TEST_STOP;
      openModal((stop ? '<h3>いまはテスト送信できません</h3>' :
        '<h3>テスト送信をしますか？</h3>' +
        '<p>「LINEに届く内容」を、いまLINEに送ります。</p>' +
        '<div class="warnbox" style="font-size:14px">これはテスト送信ですが、<b>LINE公式アカウントの無料の月200通のうち、1通を使います。</b>ご了承ください。</div>') +
        '<p class="note" style="font-size:15px;color:var(--ink)">' + esc(quotaText(q)) + '</p>' +
        (stop ? '<p class="note" style="color:var(--warn)">' + esc(stopText(q)) + '</p>' : '') +
        '<div class="actions">' + (stop ? '' : '<button class="btn" id="sdYes">はい、送ります</button>') + '<button class="btn sec" id="sdNo">' + (stop ? '閉じる' : 'やめる') + '</button></div>');
      document.getElementById('sdNo').onclick = closeModal;
      var y = document.getElementById('sdYes');
      if (y) y.onclick = function () {
        busy(this, true, '送っています…');
        api('testSend').then(function (j) {
          S.quota = j.quota; if (j.quota) hourPut('quota', j.quota); if (j.settings) S.settings = j.settings;
          openModal('<div class="bigmsg"><div class="ico">✅</div><h3 style="margin-top:8px">LINEに送りました</h3>' +
            '<p>スマホのLINEで、秘書から届いているか見てください。</p>' +
            '<div class="count">' + esc(quotaText(j.quota)) + '</div></div>' +
            '<div class="actions"><button class="btn" id="sdOk">閉じる</button></div>');
          document.getElementById('sdOk').onclick = function () { closeModal(); render(); };
        }).catch(function (e) {
          openModal('<h3>送れませんでした</h3><p>' + esc(e.message) + '</p><p class="note">1通も数えられていません。</p>' +
            '<div class="actions"><button class="btn sec" id="sdOk">閉じる</button></div>');
          document.getElementById('sdOk').onclick = closeModal;
        });
      };
    });
  }

  // LINEに届く内容（いまの設定で作ったもの）
  function previewBlock(id) {
    var next = (S.settings || {})['翌日の予定を送る'] === '○';
    return '<p class="note">' + (next ? '「翌日の予定を送る」がオンなので、明日の予定で作っています。' : '今日の予定で作っています。') + '</p>' +
      '<div id="' + id + '"><div class="loading">作っています…</div></div>';
  }
  // 作った内容は、その日のあいだ保存しておく（1日1回。日付が変わったとき・このサイトで予定や設定を変えたとき・「作り直す」を押したときだけ作る）
  function bindPreview(id, day) {
    var next = day === 'tomorrow' || (!day && (S.settings || {})['翌日の予定を送る'] === '○');
    var t = today(), target = next ? nToYmd(ymdN(t) + 1) : t;
    var key = 'lineHishoPv:' + (S.conn ? S.conn.id : '') + ':' + (day || 'line');
    var put = function (c) {
      var el = document.getElementById(id); if (!el) return;
      el.innerHTML = '<pre class="msg">' + esc(c.text) + '</pre>' +
        '<p class="note" style="text-align:right;margin-top:6px">' + esc(c.at) + ' に作成　<a href="#" class="pvRe" style="color:var(--main)">作り直す</a></p>';
      el.querySelector('.pvRe').onclick = function (e) { e.preventDefault(); make(); };
    };
    var make = function () {
      var el = document.getElementById(id); if (el) el.innerHTML = '<div class="loading">作っています…</div>';
      api('preview', day ? { day: day } : {}).then(function (j) {
        var d = new Date(), c = { date: target, text: j.text, at: (d.getMonth() + 1) + '/' + d.getDate() + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) };
        try { localStorage.setItem(key, JSON.stringify(c)); } catch (e) {}
        put(c);
      }).catch(function (e) { var el = document.getElementById(id); if (el) el.innerHTML = '<div class="card">' + esc(e.message) + '</div>'; });
    };
    var c = null; try { c = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) {}
    if (c && c.date === target) put(c); else make();
  }

  // 今日・明日：その日の予定（LINEに届くのと同じ形で表示）
  function viewDay(day) {
    app.innerHTML =
      (setupLeft() ? '<div class="card" style="border-color:var(--warn)"><b>はじめにやることが、あと' + setupLeft() + 'つ残っています。</b>' +
        '<div style="margin-top:8px"><button class="btn sec" id="toCheck">はじめにやることへ</button></div></div>' : '') +
      '<h2 style="margin-top:4px">' + (day === 'today' ? '今日の予定' : '明日の予定') + '</h2>' +
      '<div id="pv"><div class="loading">作っています…</div></div>';
    var tc = document.getElementById('toCheck'); if (tc) tc.onclick = goSetup;
    bindPreview('pv', day);
  }
  function viewToday() { viewDay('today'); }
  function viewTomorrow() { viewDay('tomorrow'); }

  // はじめにやること・つながりの一覧・送信数（ホームの3つのボタンの下に出す）
  function checkHtml() {
    var s = S.settings || {}, ok = lineOk(), left = setupLeft();
    var times = '毎日 ' + (s['リマインドの時刻'] || '07:00') + (s['翌日の予定を送る'] === '○' ? '（翌日の予定）' : '（その日の予定）');
    var row = function (label, good, text) {
      return '<div class="status"><div><b>' + label + '</b><div class="note" style="margin:0">' + esc(text) + '</div></div>' +
        (good ? '<span class="chip">OK</span>' : '<span class="chip warn">まだです</span>') + '</div>';
    };
    return '<div id="chkArea">' +
      (left ? setupCard() : '<div class="card" style="border-color:var(--main)"><b>✅ はじめにやることは、全部終わっています。</b>' +
        '<div style="margin-top:10px"><a class="btn" href="guide.html" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">はじめての方へ（設定のやり方の説明）</a></div></div>') +
      '<h2>つながりの一覧</h2><div class="card">' +
      row('スプレッドシート', true, S.sheet ? S.sheet.name : 'つながっています') +
      row('LINE', ok, ok ? '秘書のアカウントとつながっています' : 'まだつながっていません') +
      row('毎日のリマインド', !!flags().timeSet, flags().timeSet ? times : 'まだ決めていません（今は ' + times + '）') +
      '</div>' +
      '<div class="sethead"><h2 style="margin:0">今月の送信数</h2>' + (ok ? '<button class="btn sec slim" id="qRe">再読み込み</button>' : '') + '</div>' +
      '<div class="card" id="qBox2"><div class="loading" style="padding:8px">確かめています…</div></div></div>';
  }
  function bindCheck() {
    var ok = lineOk();
    if (ok) {
      var showQ = function (force) {
        var b = document.getElementById('qBox2'); if (b && force) b.innerHTML = '<div class="loading" style="padding:8px">確かめています…</div>';
        quotaHour(force).then(function (q) {
          S.quota = q; var b = document.getElementById('qBox2');
          if (b) b.innerHTML = '<div style="font-size:17px;font-weight:700">' + esc(quotaText(q)) + '</div><p class="note">無料のプランは月200通までです。数は1時間ごとに確かめます。</p>' +
            (q && q.used >= TEST_STOP ? '<div class="warnbox">' + esc(stopText(q)) + '</div>' : '');
        }).catch(function () { var b = document.getElementById('qBox2'); if (b) b.innerHTML = '<p class="note">今月の送信数を確かめられませんでした。</p>'; });
      };
      showQ(false);
      document.getElementById('qRe').onclick = function () { showQ(true); };
    } else {
      document.getElementById('qBox2').innerHTML = '<p class="note">LINEとつなぐと、ここに出ます。</p>';
    }
    var go = document.getElementById('setupGo');
    if (go) go.onclick = function () {
      var g = this.dataset.go;
      if (g === 'line') openSettings('secLine');
      else if (g === 'time') openSettings('secTime');
      else if (g === 'tasks') { S.tab = 'tasks'; render(); }
      else if (g === 'send') doSend();
      else if (g === 'homeAdd') openHomeGuide();
    };
  }

  // ---------- ホーム画面に追加（アプリのように使う） ----------
  function isStandalone() { try { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch (e) { return false; } }
  // ホーム画面から開いたときは、それだけで「ホーム画面に追加する」を終わった扱いにする
  function markStandalone() {
    if (!isStandalone() || flags().home) return;
    api('saveSettings', { settings: { '準備：ホーム画面': '○' } }).then(function (j) { S.settings = j.settings; updateHeader(); }).catch(function () {});
  }
  function inLine() { return /\bLine\//i.test(navigator.userAgent || ''); }
  function openHomeGuide() {
    openModal('<h3>スマホのホーム画面に追加する</h3>' +
      '<p class="note">このサイトをホーム画面に置くと、アプリのように1回タップで開けます。</p>' +
      '<h2 style="margin-top:10px">まず：LINEやメールから開いたとき</h2>' +

        : '<ul style="padding-left:1.3em;margin:4px 0"><li><b>LINE</b>：LINEの中で開いているときは、ここに「Safari・Chromeで開き直す」ボタンが出ます。押すと開き直せます</li>' +

      '<li><b>「ホーム画面に追加」</b>を押し、右上の<b>「追加」</b>を押します</li></ol>' +
      '<p class="note">iOSのバージョンは「設定」→「一般」→「情報」の「iOSバージョン」で分かります（18の次が26です）。</p>' +

      '<div class="actions"><button class="btn" id="hgDone">ホーム画面に追加しました</button><button class="btn sec" id="hgNo">閉じる</button></div>');

        .catch(function (e) { busy(btn, false); toast(e.message, true); });

  // ---------- ホーム（大きなボタンが並ぶ画面） ----------
  function viewHome() {
    var t = today(), wk = ['日', '月', '火', '水', '木', '金', '土'];
    var dl = function (ymd) { var p = ymd.split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2]); return (p[1]) + '/' + p[2] + '（' + wk[d.getDay()] + '）'; };
    var tm = nToYmd(ymdN(t) + 1), left = setupLeft();
    var open = allItems().filter(function (x) { return !x.over && x.kind === 'やること'; }).length;
    var b = function (to, ic, lb, sm, dot) { return '<button class="hbtn" data-to="' + to + '"><span class="ic">' + ic + '</span><span><span class="lb">' + lb + '</span><br><span class="sm">' + sm + '</span></span>' + (dot ? '<span class="dot"></span>' : '') + '</button>'; };
    app.innerHTML = '<div class="home"><div class="hello">' + esc(S.conn && S.conn.name ? S.conn.name + 'さんの秘書' : 'あなたの秘書') + '</div>' +
      b('today', '☀', '今日の予定', dl(t)) +

  // ---------- タスク（定例・単発）：定例・単発の予定・単発のやることを1つの一覧に ----------
  var STATE_CHIP = { '未着手': 'gray', '途中': '', '止まっている': 'warn', 'お返事待ち': 'amber', '完了': 'gray' };
  var PRI = { '最優先': 0, '優先': 1, '普通': 2 };
  function priOf(r) { return r['優先度'] || (r['緊急'] === '○' ? '最優先' : '普通'); }
  // 日付の計算（GASの occursOn_ と同じ考え方）
  function ymdN(s) { var p = String(s || '').split('-').map(Number); return (p.length === 3 && p[0]) ? Date.UTC(p[0], p[1] - 1, p[2]) / 86400000 : null; }
  function nToYmd(n) { var d = new Date(n * 86400000); return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2); }
  var WK7 = ['日', '月', '火', '水', '木', '金', '土'];
  function occurs(r, n) {
    var base = ymdN(r['開始日']), endN = ymdN(r['終了日']);
    if (base !== null && n < base) return false;
    if (endN !== null && n > endN) return false;
    var k = Math.max(1, Math.floor(Number(r['間隔']) || 1));
    var step = function (diff) { return base === null ? k === 1 : diff % k === 0; };
    var d = new Date(n * 86400000), y = d.getUTCFullYear(), m = d.getUTCMonth() + 1, day = d.getUTCDate(), wd = WK7[d.getUTCDay()];
    if (r['単位'] === '日') return step(n - (base === null ? 0 : base));
    if (r['単位'] === '週') {
      var days = String(r['曜日'] || '') || (base !== null ? WK7[new Date(base * 86400000).getUTCDay()] : '');
      if (days.indexOf(wd) < 0) return false;
      var wk = function (x) { return Math.floor((x + 3) / 7); };
      return step(wk(n) - (base === null ? 0 : wk(base)));
    }
    if (r['単位'] === 'か月') {
      var bd = base === null ? null : new Date(base * 86400000);
      if (!step(y * 12 + m - (bd ? bd.getUTCFullYear() * 12 + bd.getUTCMonth() + 1 : 0))) return false;
      var last = new Date(Date.UTC(y, m, 0)).getUTCDate();
      if ((r['月の決め方'] || '日付で') === '日付で') return r['日'] === String(day) || (r['日'] === '末日' && day === last);
      if (r['何曜日'] !== wd) return false;
      if (r['第何週'] === '最終週') return day + 7 > last;
      var w = Number(String(r['第何週'] || '').replace(/[^0-9]/g, ''));
      return w >= 1 && day > (w - 1) * 7 && day <= w * 7;
    }
    if (r['単位'] === '年') {
      if (base === null) return false;
      var b2 = new Date(base * 86400000);

  // 定例のカードの上に出す「毎週 月曜」「隔週 木曜」「毎月 第3土曜」などの文字

      t = (k === 1 ? '毎週' : k === 2 ? '隔週' : k + '週間ごと') + ' ' + (days.length ? d : '（曜日なし）');
      if (k === 1 && d === '毎日') t = '毎日';

  // Googleカレンダーの一覧（チェックしたものを毎日のリマインドに入れる）
  // 一覧は1時間は読み直さない（「再読み込み」で読み直す）。どれを選んでいるかは設定から出す
  function loadCalendars(force) {
    var box = document.getElementById('calBox'); if (!box) return;
    var re = document.getElementById('calRe'); if (re) re.onclick = function () { box.innerHTML = '<div class="loading" style="padding:8px">カレンダーの一覧を読み込んでいます…</div>'; loadCalendars(true); };
    var c = force ? null : hourGet('calendars');
    (c ? Promise.resolve({ calendars: c }) : api('calendars').then(function (j) {
      hourPut('calendars', (j.calendars || []).map(function (x) { return { id: x.id, name: x.name }; })); return j;
    })).then(function (j) {
      var box = document.getElementById('calBox'); if (!box) return;
      var sel = []; try { sel = JSON.parse((S.settings || {})['カレンダー'] || '[]'); } catch (e) {}
      var cals = (j.calendars || []).map(function (x) { return { id: x.id, name: x.name, selected: sel.indexOf(x.id) >= 0 }; });
      if (!cals.length) { box.innerHTML = '<p class="note">読めるカレンダーがありませんでした。</p>'; return; }
      box.innerHTML = cals.map(function (c, i) {
        return '<label class="calrow"><input type="checkbox" data-id="' + esc(c.id) + '"' + (c.selected ? ' checked' : '') + '><span>' + esc(c.name) + '</span></label>';
      }).join('') + '<div style="margin-top:12px"><button class="btn" id="calSave">選んだカレンダーを保存</button></div>';
      document.getElementById('calSave').onclick = function () {
        var ids = [].map.call(box.querySelectorAll('input:checked'), function (x) { return x.dataset.id; });
        var btn = this; busy(btn, true, '保存しています…');
        api('saveSettings', { settings: { 'カレンダー': JSON.stringify(ids) } }).then(function (k) {
          S.settings = k.settings; busy(btn, false);
          toast(ids.length ? 'カレンダーを' + ids.length + 'つ選んで保存しました' : 'カレンダーの連携をなしにしました');
        }).catch(function (e) { busy(btn, false); toast(e.message, true); });
      };
    }).catch(function (e) {
      var box = document.getElementById('calBox'); if (!box) return;
      box.innerHTML = '<div class="warnbox">' + esc(e.message) + '</div><div style="margin-top:10px"><button class="btn sec" id="calRetry">もう一度読み込む</button></div>';
      document.getElementById('calRetry').onclick = function () { box.innerHTML = '<div class="loading" style="padding:8px">読み込んでいます…</div>'; loadCalendars(); };
    });
  }

    var back = S.admFrom && S.admFrom !== 'settings' && S.admFrom !== 'admin' ? S.admFrom : 'settings';
    app.innerHTML = '<div class="sethead"><h2 style="margin:0;font-size:18px">管理モード</h2><button class="btn sec slim" id="admBack">' + (back === 'settings' ? '設定に戻る' : '戻る') + '</button></div>' +
      '<h2>お問い合わせ</h2><div id="inqBox"><div class="loading">読み込んでいます…</div></div>' +
      '<h2>お客さんの状況</h2><div id="admBox"><div class="loading">読み込んでいます…</div></div>';
    document.getElementById('admBack').onclick = function () { S.tab = back; if (back === 'settings') S.setSub = 'all'; render(); };
    loadInquiries();
    adminApi('adminList').then(function (j) {
      var box = document.getElementById('admBox'); if (!box) return;
      var us = j.users || [];
      var fin = function (u) { return /完了/.test(u.progress || ''); };
      var nDone = us.filter(fin).length, nMid = us.filter(function (u) { return u.progress && !fin(u); }).length, nNone = us.filter(function (u) { return !u.progress; }).length;
      us.sort(function (a, b) { var k = function (u) { return fin(u) ? 2 : u.progress ? 1 : 0; }; return k(a) - k(b) || String(a.id).localeCompare(String(b.id)); });
      box.innerHTML = '<div class="card"><b>全員 ' + us.length + '人</b>：終わった ' + nDone + '人／途中 ' + nMid + '人／まだ記録なし ' + nNone + '人' +
        '<p class="note" style="margin-bottom:0">「まだ記録なし」は、この版の設定サイトをまだ開いていない人です（パスワードを変えていない人もここに入ります）。</p></div>' +
        us.map(function (u) {

  // 管理モードの問い合わせ一覧（新しい順。未対応を先に）
  function loadInquiries() {
    adminApi('inquiryList').then(function (j) {
      var box = document.getElementById('inqBox'); if (!box) return;
      var it = j.items || [];
      S.inq = it.filter(function (x) { return x['状態'] === '未対応'; }).length; showInqBar();
      it.sort(function (a, b) { return (a['状態'] === '未対応' ? 0 : 1) - (b['状態'] === '未対応' ? 0 : 1); });
      if (!it.length) { box.innerHTML = '<div class="card"><p class="note" style="margin:0">お問い合わせは、まだありません。</p></div>'; return; }
      box.innerHTML = it.map(function (x) {
        var open = x['状態'] === '未対応', n = Number(x['画像の枚数'] || 0);
        return '<div class="card" data-no="' + esc(x['番号']) + '"' + (open ? ' style="border-color:var(--warn)"' : ' style="opacity:.7"') + '>' +
          '<div class="t">' + esc(x['名前']) + ' ' + (open ? '<span class="chip warn">未対応</span>' : '<span class="chip">対応済み</span>') + '</div>' +
          '<div class="m">' + esc(x['受付日時']) + '／利用者ID：' + esc(x['利用者ID']) + '</div>' +
          '<div class="m">メール：<a href="mailto:' + esc(x['メールアドレス']) + '" style="color:var(--main)">' + esc(x['メールアドレス']) + '</a></div>' +
          '<div style="white-space:pre-wrap;margin-top:8px">' + esc(x['内容']) + '</div>' +
          (n ? '<div class="inqfull"><button class="btn sec slim iqImg" style="margin-top:8px">画像を見る（' + n + '枚）</button></div>' : '') +
          replyBlock(x) +
          '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">' + (open ? '<button class="btn slim iqDone">対応済みにする</button>'
            : '<span class="btn slim done">対応済み</span><button class="btn sec slim iqUndo">未対応に戻す</button>') + '</div></div>';
      }).join('');
      [].forEach.call(box.querySelectorAll('.iqImg'), function (b) {
        b.onclick = function () {

          }).catch(function (e) { busy(b, false); toast(e.message, true); });
        };

          withBusy(adminApi('inquiryReply', { no: card.dataset.no, text: text })).then(function (k) { toast(k.mailed === undefined ? '返信を送りました' : k.mailed ? '返信を送りました（メールでも送りました）' : '返信を送りました（メールは送れませんでした）', k.mailed === false); loadInquiries(); })
            .catch(function (e) { busy(b, false); toast(e.message, true); });
        };
      });
      [].forEach.call(box.querySelectorAll('.iqDone, .iqUndo'), function (b) {
        b.onclick = function () {

            .catch(function (e) { toast(e.message, true); });
        };

  // 返信の欄（サイトで届けられるのは、ログインして送ってくれた人だけ）

    return done + '<label class="f" style="margin-top:10px">' + (x['返信'] ? '返信を送り直す' : '返信') + '</label>' +
      '<p class="note" style="margin:0 0 4px">' + (site ? 'お返事は、この方の設定サイトとメール（' + esc(x['メールアドレス']) + '）の両方に届きます。'

      '<div style="margin-top:6px"><button class="btn slim iqSend">返信を送る</button></div>';

  // パスワードを変える（スプレッドシート側と、顧客管理側の両方）
  function openPwModal() {
    openModal('<h3>パスワードを変える</h3>' +
      '<label class="f">新しいパスワード <small>（8文字以上）</small></label><input type="password" id="pmA" autocomplete="new-password">' +
      '<label class="f">もう一度</label><input type="password" id="pmB" autocomplete="new-password">' +
      '<p class="note">変えたあとは、ほかの端末では新しいパスワードでログインし直してください。</p>' +
      '<div class="actions"><button class="btn" id="pmGo">変える</button><button class="btn sec" id="pmNo">やめる</button></div>');
    document.getElementById('pmNo').onclick = closeModal;
    document.getElementById('pmGo').onclick = function () {
      var a = document.getElementById('pmA').value, b = document.getElementById('pmB').value, old = S.conn.pw;
      if (a.length < 8) { toast('8文字以上にしてください', true); return; }
      if (a !== b) { toast('2つのパスワードがちがいます', true); return; }
      var btn = this; busy(btn, true, '変えています…');
      api('changeKey', { newKey: a }).then(function () {
        return adminApi('changePassword', { newPw: a }).catch(function (e) {
          // 顧客管理で失敗したら、スプレッドシート側を元に戻す
          return post_(S.conn.url, { action: 'changeKey', key: a, accountId: S.conn.id, newKey: old }).then(function () { throw e; });
        });
      }).then(function () { S.conn.pw = a; saveConn(S.conn); closeModal(); toast('パスワードを変えました'); })
        .catch(function (e) { busy(btn, false); toast(e.message, true); });
    };
  }

  // ---------- 起動 ----------
  // 開いたときの画面
  //   緑の帯 → 帯のまん中から細い線が落ちていく。止まらずに、落ちながら先に雨だれができてふくらむ
  //   → 雨だれだけが離れて落ち続け、離れた瞬間に線は消える → 落ちるほど速く・縦長に
  //   → ロゴの中心より5%下に着いてつぶれる → 少し止まる → はずんで、まん丸になって5%上（ロゴの中心）に戻る
  //   → まん丸が縦横そろって広がりながら、角の丸い正方形になる
  //   → 白い文字が1字ずつ打たれる → タップで中へ
  (function splash() {
    var sp = document.getElementById('splash'), band = sp.querySelector('.band'), line = sp.querySelector('.line'), drop = sp.querySelector('.drop'),
        lw = sp.querySelector('.lw'), logo = sp.querySelector('.logo'), s1 = logo.querySelector('.s1'), s2 = logo.querySelector('.s2'),
        rule = logo.querySelector('.rule'), s3 = logo.querySelector('.s3'), tap = sp.querySelector('.tap');
    var A = 'LINEで届く', B = 'あなたの秘書', C = 'リマインダー', cur = '<span class="cur"></span>';
    var vw = window.innerWidth, vh = window.innerHeight, bandB = band.getBoundingClientRect().height;
    var W = Math.round(Math.min(vw * 0.56, 232, (vh - bandB) * 0.5));          // 正方形のロゴの一辺
    var Yc = Math.round(bandB + (vh - bandB) * 0.45);                        // ロゴのまん中
    var G = Yc + Math.round(W * 0.05);                                       // しずくの着地点（ロゴの中心より5%下）
    var DH = 20, R = Math.round(W * 0.23);                                   // しずくの高さ、ロゴの角の丸み
    s1.style.fontSize = Math.round(W * 0.064) + 'px'; s2.style.fontSize = Math.round(W * 0.128) + 'px'; s3.style.fontSize = Math.round(W * 0.056) + 'px';
    rule.style.margin = Math.round(W * 0.05) + 'px 0 ' + Math.round(W * 0.045) + 'px';
    lw.style.top = Yc + 'px';
    line.style.top = bandB + 'px';
    tap.style.top = (Yc + W / 2 + 34) + 'px';
    var anims = [], timers = [], raf = 0, ready = false, done = false;
    var at = function (ms, fn) { timers.push(setTimeout(fn, ms)); };
    var go = function (el, frames, opt) { var a = el.animate(frames, Object.assign({ fill: 'forwards' }, opt)); anims.push(a); return a; };
    var fontReady = (document.fonts && document.fonts.load) ? Promise.race([document.fonts.load("700 20px 'SplashFont'"), new Promise(function (r) { setTimeout(r, 1500); })]) : Promise.resolve();
    function typeOut(el, text, ms, then) {
      var i = 0;
      (function next() { i++; el.innerHTML = esc(text.slice(0, i)) + cur; if (i < text.length) at(ms, next); else at(ms, function () { el.textContent = text; then && then(); }); })();
    }
    function type() {
      fontReady.then(function () {
        typeOut(s1, A, 65, function () {
          typeOut(s2, B, 90, function () {
            go(rule, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 420, easing: 'cubic-bezier(.65,0,.35,1)' });
            at(260, function () { typeOut(s3, C, 70, function () { at(250, function () { tap.classList.add('on'); ready = true; }); }); });
          });
        });
      });
    }
    function setLogo(w, h, r) { logo.style.width = w + 'px'; logo.style.height = h + 'px'; logo.style.borderRadius = r + 'px'; }
    function finalState() {
      timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf); anims.forEach(function (a) { try { a.cancel(); } catch (e) {} }); anims = [];
      band.style.transform = 'scaleX(1)'; line.style.opacity = '0'; drop.style.opacity = '0';
      setLogo(W, W, R); logo.style.boxShadow = '0 18px 40px rgba(31,138,76,.22)'; rule.style.transform = 'scaleX(1)';
      s1.textContent = A; s2.textContent = B; s3.textContent = C; tap.classList.add('on'); ready = true;
    }
    // 着地してから：つぶれる → 少し止まる → はずんで、まん丸になって中心に戻る → 縦横そろって広がり、正方形に
    function land(sx, sy) {
      var base = 'translate(0px, ' + (G - DH) + 'px) ';
      drop.style.transformOrigin = '50% 100%';
      go(drop, [{ transform: base + 'scale(' + sx + ',' + sy + ')' }, { transform: base + 'scale(1.9, .32)' }], { duration: 110, easing: 'cubic-bezier(.2,.8,.3,1)' });
      at(250, function () {                                                     // 少し止まってから、はずむ
        drop.style.opacity = '0';
        var w0 = 27, h0 = 6, d = 18, dy0 = G - h0 / 2 - Yc;                     // つぶれた形のまん中は、ロゴの中心より少し下
        setLogo(w0, h0, h0 / 2);
        lw.style.transform = 'translateY(' + dy0 + 'px)';
        // はずんで上へ：いったん縦にのびて、まん丸に落ち着く。位置は5%上（ロゴの中心）へ
        go(logo, [{ width: w0 + 'px', height: h0 + 'px', borderRadius: h0 / 2 + 'px' },
                  { width: '16px', height: '21px', borderRadius: '10px', offset: .5 },
                  { width: d + 'px', height: d + 'px', borderRadius: d / 2 + 'px' }], { duration: 950, easing: 'cubic-bezier(.4,0,.25,1)' });
        go(lw, [{ transform: 'translateY(' + dy0 + 'px)' }, { transform: 'translateY(0px)' }],      // ゆっくり5%上（ロゴの中心）へ
          { duration: 950, easing: 'cubic-bezier(.4,0,.25,1)' });
        // まん丸になったら：読み込みが終わるまで、ふくらんだり縮んだりして待つ → 終わったら広がってロゴに
        at(950, function () {
          if (BOOT.done) { at(150, grow); return; }
          var pulse = logo.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.3)' }, { transform: 'scale(1)' }], { duration: 1000, easing: 'ease-in-out', iterations: Infinity });
          anims.push(pulse);
          BOOT.cb = function () { var t = (pulse.currentTime || 0) % 1000; at(1000 - t, function () { pulse.cancel(); grow(); }); };
        });
        function grow() {                                                        // まん丸が、縦横そろって広がりながら正方形に
          go(logo, [{ width: d + 'px', height: d + 'px', borderRadius: d / 2 + 'px' },
                    { width: Math.round(W * 1.04) + 'px', height: Math.round(W * 1.04) + 'px', borderRadius: Math.round(R * 1.04) + 'px', offset: .72 },
                    { width: W + 'px', height: W + 'px', borderRadius: R + 'px' }], { duration: 700, easing: 'cubic-bezier(.33,.9,.36,1)' });
          go(logo, [{ boxShadow: '0 18px 40px rgba(31,138,76,0)' }, { boxShadow: '0 18px 40px rgba(31,138,76,.22)' }], { delay: 300, duration: 800, easing: 'ease' });
          at(620, type);
        }
      });
    }
    var reduce = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) || !Element.prototype.animate;
    requestAnimationFrame(function (t0) {
      if (reduce) { finalState(); return; }
      go(band, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 620, easing: 'cubic-bezier(.65,0,.35,1)' });
      var START = 520, T = 980, D = G - bandB, DETACH = .6;                    // 落ちはじめ、落ちる時間、落ちる距離、離れるところ
      var smooth = function (x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
      (function frame(now) {
        var t = now - t0 - START;
        if (t < 0) { raf = requestAnimationFrame(frame); return; }
        var p = Math.min(1, t / T), L = bandB + D * p * p;                    // いちばん下の点（重力のように、だんだん速く）
        var s = p;                                                            // 速さ（0〜1）
        var g = smooth((p - .2) / .38);                                       // しずくの大きさ（落ちながらふくらむ）
        var sx = 1 - .24 * s * s, sy = 1 + .62 * s * s;                       // 速いほど細く縦長に
        var h = DH * g * sy, top = L - h;
        drop.style.opacity = g > 0 ? '1' : '0';
        drop.style.transform = 'translate(0px, ' + top + 'px) scale(' + (g * sx) + ',' + (g * sy) + ')';
        if (p < DETACH) line.style.height = Math.max(0, top + 2 - bandB) + 'px';   // 線は、しずくの先までつながっている
        else line.style.opacity = '0';                                        // 離れた瞬間に、線は消える
        if (p < 1) raf = requestAnimationFrame(frame); else land(g * sx, g * sy);
      })(t0);
    });
    sp.onclick = function () {
      if (!ready) return;                                                         // 動きの途中（読み込み中）は、押しても進まない
      if (done) return; done = true;
      logo.animate([{ transform: 'scale(1)' }, { transform: 'scale(.93)', offset: .3 }, { transform: 'scale(1.03)', offset: .65 }, { transform: 'scale(1)' }],
        { duration: 460, easing: 'ease-out', fill: 'forwards' });
      setTimeout(function () { sp.classList.add('out'); }, 400);
      setTimeout(function () { sp.style.display = 'none'; startChoice(); }, 900);
    };
  })();

  S.conn = loadConn();
  if (!S.conn || !S.conn.id) { renderLogin(); bootDone(); }
  else {
    doLogin({ id: S.conn.id, pw: S.conn.pw }).then(function () { return S.pre; })
      .catch(function (e) { renderLogin('自動でログインできませんでした：' + e.message); }).then(bootDone, bootDone);
    setTimeout(bootDone, 15000);                                                  // 15秒たっても終わらないときは、待たずにロゴを出す
  }
})();
</script>
</body>
